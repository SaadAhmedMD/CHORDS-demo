<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHORDS Command Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: an operations console in VCH colours. Light working surface, one dark "engine" panel, schematic map as the anchor. */
:root {
  --bg: #edf2f5;
  --panel: #ffffff;
  --panel2: #f5f8fa;
  --ink: #142a3c;
  --ink2: #3c5366;
  --muted: #687d8e;
  --line: #d6e0e7;
  --ocean: #0078ae;
  --oceansoft: #e2f0f7;
  --navy: #1f3b57;
  --lime: #c1d82e;
  --limeink: #5b6900;
  --good: #2c7a4b; --goodsoft: #e2f1e7;
  --warn: #a8650a; --warnsoft: #fbefd9;
  --crit: #b3261e; --critsoft: #f8e2df;
  --eng: #0d2032; --eng2: #132b42; --engline: #22405c; --engink: #d5e5f1; --engmuted: #8eaac0;
  --t-ltc: #1f3b57; --t-al: #0078ae; --t-sh: #2c7a4b; --t-cch: #a8650a; --t-hhs: #6a5ca8;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --serif: 'IBM Plex Serif', Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font-family: var(--sans); color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--ocean); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: var(--navy); color: #fff; display: flex; align-items: center; gap: 18px; padding: 10px 22px; }
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; flex-shrink: 1; }
.brand > div { min-width: 0; }
.brand-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.brand-name { font-weight: 700; letter-spacing: .02em; font-size: 15px; }
.brand-sub { font-size: 11.5px; color: #b9cfe0; }
.steps { display: flex; gap: 4px; flex: 1; justify-content: center; flex-wrap: nowrap; }
.step { border: 0; background: transparent; color: #b9cfe0; font-size: 12.5px; font-weight: 500; padding: 7px 9px; white-space: nowrap; border-radius: 7px; cursor: pointer; display: flex; align-items: center; gap: 7px; }
.step b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #5f7e98; font-size: 11px; }
.step:hover { background: rgba(255,255,255,.08); color: #fff; }
.step.on { background: #fff; color: var(--navy); }
.step.on b { border-color: var(--lime); background: var(--lime); color: var(--navy); }
.top-right { display: flex; align-items: center; gap: 8px; }
.chip-demo { font-size: 11px; color: #e9f3c4; border: 1px solid #5e7a2a; background: rgba(193,216,46,.12); padding: 4px 9px; border-radius: 99px; white-space: nowrap; }
.tbtn { border: 1px solid #3d5a76; background: transparent; color: #dbe8f2; font-size: 12px; padding: 6px 10px; border-radius: 7px; cursor: pointer; }
.tbtn:hover, .tbtn.on { background: #2d4a66; }
.tbtn[disabled] { opacity: .4; cursor: default; }
.tbtn.next { background: var(--lime); border-color: var(--lime); color: var(--navy); font-weight: 600; }
.tbtn.next:hover { background: #d3e65a; }

/* page */
.wrap { max-width: 1480px; margin: 0 auto; padding: 18px 22px 40px; }
.notes-on .wrap { padding-bottom: 110px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ocean); margin-bottom: 4px; }
.title { font-size: 26px; font-weight: 700; color: var(--navy); }
.subtitle { color: var(--ink2); margin-top: 4px; max-width: 80ch; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--navy); font-weight: 600; font-size: 13px; padding: 9px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--ocean); }
.btn.primary { background: var(--ocean); border-color: var(--ocean); color: #fff; }
.btn.primary:hover { background: #00669a; }
.btn.lime { background: var(--lime); border-color: var(--lime); color: var(--navy); }
.btn[disabled] { opacity: .55; cursor: default; }

.grid { display: grid; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.card h3 { font-size: 13px; font-weight: 600; color: var(--navy); display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.card h3 small { font-weight: 400; color: var(--muted); font-size: 12px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; margin-bottom: 14px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.tile .lab { font-size: 12px; color: var(--muted); font-weight: 500; }
.tile .big { font-size: 34px; font-weight: 700; color: var(--navy); line-height: 1.15; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
.tile .sub { font-size: 12px; color: var(--ink2); }
.tile.alert { background: var(--critsoft); border-color: #efc4be; }
.tile.alert .big { color: var(--crit); }
.tile.good { background: var(--goodsoft); border-color: #b9dcc6; }
.tile.good .big { color: var(--good); }
.tile.lime { background: #f6f9df; border-color: #dbe78f; }
.tile.lime .big { color: var(--limeink); }

/* map */
.mapwrap { position: relative; }
.map svg { width: 100%; height: auto; display: block; border-radius: 10px; background: var(--panel2); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11.5px; color: var(--ink2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.mline { fill: none; stroke-width: 2; stroke-linecap: round; animation: draw 1.1s ease forwards; }
@keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.popin { transform-box: fill-box; transform-origin: center; animation: pop .45s ease both; }
@keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: .8; } }
.halo { animation: pulse 2s ease-in-out infinite; }

/* tables and bars */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 6px 6px; border-bottom: 1px solid var(--line); }
td { padding: 7px 6px; border-bottom: 1px solid #edf2f5; font-size: 13px; vertical-align: middle; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--panel2); color: var(--ink2); border: 1px solid var(--line); white-space: nowrap; }
.pill.open { background: #f1f7cf; border-color: #d3e273; color: var(--limeink); }
.pill.zero { background: var(--critsoft); border-color: #efc4be; color: var(--crit); }
.pill.good { background: var(--goodsoft); border-color: #b9dcc6; color: var(--good); }
.pill.ocean { background: var(--oceansoft); border-color: #b9dbec; color: var(--ocean); }
.pill.warn { background: var(--warnsoft); border-color: #ecd09e; color: var(--warn); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.bar { height: 8px; background: #e6edf2; border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--ocean); border-radius: 99px; }
.srcnote { font-size: 11.5px; color: var(--muted); margin-top: 10px; }

/* engine panel */
.cc { display: grid; grid-template-columns: minmax(0,1fr); gap: 14px; }
.cc.withEngine { grid-template-columns: minmax(0,1fr) 380px; }
.engine { background: var(--eng); color: var(--engink); border-radius: 14px; border: 1px solid var(--engline); display: flex; flex-direction: column; min-height: 560px; position: sticky; top: 72px; max-height: calc(100vh - 90px); }
.engine-h { padding: 14px 16px; border-bottom: 1px solid var(--engline); display: flex; align-items: center; gap: 10px; }
.engine-h .t { font-weight: 600; color: #fff; }
.engine-h .s { font-size: 11.5px; color: var(--engmuted); font-family: var(--mono); }
.engine-feed { flex: 1; overflow-y: auto; padding: 12px 16px; font-family: var(--mono); font-size: 12px; line-height: 1.55; }
.engine-feed .think { color: var(--engmuted); font-family: var(--sans); font-style: italic; font-size: 12.5px; margin: 6px 0 8px; }
.engine-feed .tool { margin-bottom: 9px; animation: rise .3s ease both; }
.engine-feed .tool .n { color: var(--lime); }
.engine-feed .tool .src { color: #6f93b0; }
.engine-feed .tool .fres { color: var(--engink); padding-left: 14px; }
.engine-f { padding: 12px 16px; border-top: 1px solid var(--engline); display: flex; gap: 8px; align-items: center; }
.engine-f .stat { font-size: 12px; color: var(--engmuted); }
.engine-f .stat b { color: var(--lime); font-size: 18px; font-variant-numeric: tabular-nums; }
@keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.spin { width: 9px; height: 9px; border-radius: 50%; background: var(--lime); animation: pulse 1s infinite; display: inline-block; }

/* opportunities */
.opp { display: grid; grid-template-columns: 8px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 11px 4px; border-bottom: 1px solid #edf2f5; animation: rise .35s ease both; }
.opp:last-child { border-bottom: 0; }
.opp .sev { width: 8px; height: 36px; border-radius: 4px; }
.opp .ot { font-weight: 600; color: var(--navy); }
.opp .os { font-size: 12px; color: var(--muted); }

/* person */
.person { display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 14px; align-items: start; }
.plist .grp { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 10px 12px 6px; }
.prow { width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 12px; border-left: 3px solid transparent; cursor: pointer; display: block; border-bottom: 1px solid #edf2f5; }
.prow:hover { background: var(--panel2); }
.prow.on { background: var(--oceansoft); border-left-color: var(--ocean); }
.prow .pn { font-weight: 600; color: var(--navy); font-size: 13.5px; }
.prow .pd { font-size: 12px; color: var(--muted); }
.ph { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--oceansoft); color: var(--ocean); display: grid; place-items: center; font-weight: 700; }
.need { display: grid; grid-template-columns: 1fr 120px; gap: 10px; align-items: center; font-size: 13px; padding: 4px 0; }
.fit { display: grid; grid-template-columns: 22px 170px 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px solid #edf2f5; font-size: 13px; align-items: center; }
.fit .x { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.fit .x.no { background: var(--critsoft); color: var(--crit); }
.fit .x.yes { background: var(--goodsoft); color: var(--good); }
.pkg { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.pkg div { border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.pkg div.done { border-style: solid; border-color: #b9dcc6; background: var(--goodsoft); color: var(--good); animation: rise .25s ease both; }
.callout { background: var(--navy); color: #e8f0f6; border-radius: 12px; padding: 16px 18px; }
.callout b { color: var(--lime); }

/* options */
.opts { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
.opt { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--panel); display: flex; flex-direction: column; gap: 6px; }
.opt.sq { background: var(--panel2); }
.opt .on { font-weight: 700; color: var(--navy); }
.opt .os { font-size: 12px; color: var(--muted); min-height: 34px; }
.kv { display: flex; justify-content: space-between; font-size: 12.5px; border-top: 1px solid #edf2f5; padding-top: 5px; }
.kv span:first-child { color: var(--muted); }
.kv b { font-variant-numeric: tabular-nums; }
.slider { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.slider input { flex: 1; accent-color: var(--ocean); }
.slider output { font-weight: 700; color: var(--ocean); min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
.res { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.metric .lab { font-size: 12px; color: var(--muted); }
.metric .v { font-size: 24px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
.metric .r { font-size: 11.5px; color: var(--ink2); }
.range { position: relative; height: 10px; background: #e6edf2; border-radius: 99px; margin-top: 6px; }
.range span { position: absolute; top: 0; height: 10px; background: #9fcbe2; border-radius: 99px; }
.range i { position: absolute; top: -3px; width: 3px; height: 16px; background: var(--navy); border-radius: 2px; }
.memo { font-family: var(--serif); font-size: 14.5px; line-height: 1.65; color: var(--ink); }
.memo p { margin: 0 0 10px; max-width: 75ch; }
sup[data-tip] { color: var(--ocean); cursor: help; font-family: var(--sans); font-weight: 600; font-size: 10px; }

/* gift */
.gift { display: grid; grid-template-columns: minmax(0,1.15fr) minmax(0,1fr); gap: 14px; }
.road td:first-child { font-weight: 600; color: var(--navy); }
.endcard { background: var(--navy); color: #fff; border-radius: 16px; padding: 26px 28px; display: grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1fr); gap: 24px; align-items: center; margin-top: 14px; }
.endcard .nm { font-size: 28px; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.endcard .nm span { color: var(--lime); }
.tier { border: 1px solid #3d5a76; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.tier .a { font-size: 26px; font-weight: 700; color: var(--lime); }
.tier .d { font-size: 12.5px; color: #c9dae7; }

/* notes, nav, modal, tooltip, toast */
.notes { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: #fffbe6; border-top: 1px solid #ecdf9b; padding: 10px 22px 12px; font-size: 13.5px; color: #4d4300; display: flex; gap: 14px; align-items: flex-start; }
.notes b { white-space: nowrap; }
.modal-bg { position: fixed; inset: 0; background: rgba(13,32,50,.45); z-index: 40; display: grid; place-items: center; }
.modal { background: #fff; border-radius: 14px; padding: 20px; width: min(460px, 92vw); }
.modal label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
.modal input[type=text] { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
#tooltip { position: fixed; z-index: 60; max-width: 320px; background: var(--eng); color: var(--engink); font-size: 12px; line-height: 1.5; padding: 8px 11px; border-radius: 8px; pointer-events: none; display: none; box-shadow: 0 10px 28px rgba(6,17,30,.3); }
#tooltip .s { font-family: var(--mono); font-size: 10.5px; color: var(--lime); margin-top: 4px; }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 50; background: var(--eng); color: #eef5fa; padding: 11px 18px; border-radius: 10px; font-size: 13px; display: flex; gap: 9px; align-items: center; box-shadow: 0 12px 32px rgba(6,17,30,.35); animation: rise .25s ease both; }
.toast i { width: 9px; height: 9px; border-radius: 50%; background: var(--lime); display: inline-block; }

.settled .opp, .settled .tool, .settled .popin { animation: none; }

@media (max-width: 1360px) {
  .step:not(.on) span { display: none; }
}
@media (max-width: 1150px) {
  .cc.withEngine { grid-template-columns: minmax(0,1fr); }
  .engine { position: static; max-height: none; min-height: 360px; }
  .tiles { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .opts { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .gift, .endcard { grid-template-columns: minmax(0,1fr); }
  .brand { min-width: 0; }
}
@media (max-width: 760px) {
  .person { grid-template-columns: minmax(0,1fr); }
  .res { grid-template-columns: minmax(0,1fr); }
  .opts { grid-template-columns: minmax(0,1fr); }
  .step span { display: none; }
  .head { flex-direction: column; align-items: flex-start; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; }
}

</style>
</head>

<script>
/* ============================================================
   CHORDS Command Centre — illustrative data layer
   Shaped like the real sources (Cerner acute census, PARIS
   community data, operator returns, contracts database, finance
   GL, Signal 1 model outputs). ALL PATIENT DATA IS SYNTHETIC.
   Acute site names are real; their numbers are illustrative.
   ============================================================ */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const DATA = (() => {
  const sites = [
    { id: 'vgh',  name: 'Vancouver General Hospital', short: 'VGH',             org: 'VCH',        lat: 49.2618, lon: -123.1234, beds: 700, alc: 62, edWaiting: 19 },
    { id: 'sph',  name: "St. Paul's Hospital",        short: "St. Paul's",      org: 'Providence', lat: 49.2803, lon: -123.1291, beds: 400, alc: 38, edWaiting: 14 },
    { id: 'msj',  name: 'Mount Saint Joseph Hospital', short: 'Mount St. Joseph', org: 'Providence', lat: 49.2588, lon: -123.0933, beds: 120, alc: 22, edWaiting: 3 },
    { id: 'ubch', name: 'UBC Hospital',               short: 'UBC Hospital',    org: 'VCH',        lat: 49.2643, lon: -123.2457, beds: 100, alc: 18, edWaiting: 0 },
    { id: 'rh',   name: 'Richmond Hospital',          short: 'Richmond',        org: 'VCH',        lat: 49.1683, lon: -123.1452, beds: 240, alc: 34, edWaiting: 9 },
    { id: 'lgh',  name: 'Lions Gate Hospital',        short: 'Lions Gate',      org: 'VCH',        lat: 49.3207, lon: -123.0711, beds: 270, alc: 30, edWaiting: 8 },
    { id: 'sqgh', name: 'Squamish General Hospital',  short: 'Squamish',        org: 'VCH',        lat: 49.7016, lon: -123.1558, beds: 20,  alc: 5,  edWaiting: 1, coastal: true },
    { id: 'sech', name: 'Sechelt Hospital',           short: 'Sechelt',         org: 'VCH',        lat: 49.4742, lon: -123.7545, beds: 40,  alc: 7,  edWaiting: 2, coastal: true },
    { id: 'qgh',  name: 'qathet General Hospital',    short: 'qathet (Powell River)', org: 'VCH',  lat: 49.8352, lon: -124.5247, beds: 30,  alc: 5,  edWaiting: 1, coastal: true },
  ];

  // Community portfolio (illustrative). costNight = illustrative cost per bed-night.
  const portfolio = [
    { id: 'ltc',   label: 'Long-term care',              places: 4600, open: 4,  costNight: 320,  src: 'PARIS · operator returns' },
    { id: 'ltcs',  label: 'Secured long-term care',      places: 380,  open: 0,  costNight: 460,  src: 'PARIS · operator returns' },
    { id: 'al',    label: 'Assisted living',             places: 1050, open: 3,  costNight: 165,  src: 'PARIS · operator returns' },
    { id: 'sh',    label: 'Supported housing (MHSU)',    places: 2200, open: 4,  costNight: 120,  src: 'contracts database · operator returns' },
    { id: 'cch',   label: 'Complex care housing',        places: 140,  open: 0,  costNight: 350,  src: 'contracts database' },
    { id: 'hhs',   label: 'Intensive home support',      places: 60,   open: 2,  costNight: 240,  src: 'PARIS · home health' },
    { id: 'hah',   label: 'Hospital at Home',            places: 30,   open: 8,  costNight: 650,  src: 'HaH program census', virtual: true },
    { id: 'srm',   label: 'Seniors Remote Monitoring',   places: 700,  open: 88, costNight: 12,   src: 'SRM program census', virtual: true },
  ];

  // Community sites for the map (generic names; numbers illustrative)
  const nodes = [
    { id: 'n1',  type: 'ltc', name: 'Long-term care · Kerrisdale',       lat: 49.2330, lon: -123.1560, beds: 142, open: 1 },

/* ============================================================
   CHORDS decision engine (demo). Every figure on screen is
   computed here from DATA at runtime.
   ============================================================ */
const Engine = (() => {
  const D = DATA;
  const siteById = Object.fromEntries(D.sites.map((s) => [s.id, s]));
  const nodeById = Object.fromEntries(D.nodes.map((n) => [n.id, n]));
  const needToType = { ltc: 'ltc', al: 'al', sh: 'sh', home: 'hhs' };

  function km(a, b) {
    const R = 6371, toR = Math.PI / 180;
    const dLat = (b.lat - a.lat) * toR, dLon = (b.lon - a.lon) * toR;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * toR) * Math.cos(b.lat * toR) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }

  function census() {
    const bySite = D.sites.map((s) => ({ ...s, alcCount: D.patients.filter((p) => p.site === s.id).length }));
    const byNeed = {};
    D.patients.forEach((p) => { byNeed[p.need] = (byNeed[p.need] || 0) + 1; });
    const total = D.patients.length;
    const edWaiting = D.sites.reduce((a, s) => a + s.edWaiting, 0);
    return { total, bySite, byNeed, edWaiting, patientDays: D.patients.reduce((a, p) => a + p.days, 0) };
  }

  function capacity() {
    const places = D.portfolio.filter((p) => !p.virtual).reduce((a, p) => a + p.places, 0);
    const openResidential = D.portfolio.filter((p) => !p.virtual).reduce((a, p) => a + p.open, 0);
    return { places, openResidential, portfolio: D.portfolio };
  }

  function match() {
    const taken = new Set();
    const matches = [];
    D.nodes.filter((n) => n.open > 0).forEach((node) => {
      for (let i = 0; i < node.open; i++) {
        const cands = D.patients.filter((p) => !taken.has(p.id) && needToType[p.need] === node.type);
        if (!cands.length) continue;
        cands.sort((a, b) => score(b, node) - score(a, node));
        const p = cands[0];
        taken.add(p.id);
        matches.push({ patient: p, node, km: km(siteById[p.site], node) });
      }
    });
    return { matches, taken };
  }
  function score(p, node) {
    let s = p.days - km(siteById[p.site], node) * 0.8;
    if (p.persona === 'joseph' && node.id === 'n2') s += 500; // prefers South Vancouver
    return s;
  }

  function srm(taken) {
    const c = D.patients.filter((p) => p.need === 'home' && !taken.has(p.id) && p.age >= 65)
      .sort((a, b) => b.days - a.days).slice(0, D.srmCandidates);
    c.forEach((p) => taken.add(p.id));
    return c;
  }

  function hah() {
    const eligible = D.inpatients.filter((p) => p.eligible !== false);
    const screened = D.occupiedAcute;
    return { screened, eligible, ineligible: D.inpatients.filter((p) => p.eligible === false) };
  }

  function remaining(taken) {
    const rest = D.patients.filter((p) => !taken.has(p.id));
    const by = {};
    rest.forEach((p) => { by[p.need] = (by[p.need] || 0) + 1; });
    const noSetting = (by.abi || 0) + (by.complex || 0);
    return { rest, by, noSetting };
  }

  function abiCohort() {
    const c = D.patients.filter((p) => p.need === 'abi');
    const avgDays = c.reduce((a, p) => a + p.days, 0) / c.length;
    const sites = new Set(c.map((p) => p.site)).size;
    const bedDaysYr = c.length * 365;
    return { n: c.length, avgDays, sites, bedDaysYr, valueYr: bedDaysYr * D.costs.alcDay, patients: c };
  }

  // Options model with Monte Carlo bounds. beds = {A,B,C}, occ = central occupancy
  function abiModel(beds, occ) {
    const cohort = abiCohort();
    const opts = D.abiOptions;
    const placedRaw = opts.reduce((a, o) => a + Math.min(beds[o.id] || 0, o.maxBeds, o.fits), 0);
    const placed = Math.min(cohort.n, placedRaw);
    const totalBeds = opts.reduce((a, o) => a + (beds[o.id] || 0), 0);
    const opexYr = opts.reduce((a, o) => a + (beds[o.id] || 0) * o.costNight * 365, 0);
    const capex = opts.reduce((a, o) => a + ((beds[o.id] || 0) > 0 ? o.capex : 0), 0);
    // Monte Carlo bounds: occupancy, placement breakdown, cost overrun (acute cost held at the conservative rate)
    const r = mulberry32(42);
    const sims = [];
    for (let i = 0; i < 800; i++) {
      const o = Math.max(0.6, Math.min(0.99, occ + (r() - 0.5) * 0.14));
      const breakdown = r() * 0.15;
      const costMul = 1 + (r() + r() + r() - 1.5) * 0.16;
      const bd = placed * 365 * o * (1 - breakdown);
      sims.push({ bd, net: bd * D.costs.alcDay - opexYr * costMul });
    }
    const q = (arr, p) => { const s = [...arr].sort((a, b) => a - b); return s[Math.floor(p * (s.length - 1))]; };
    const bedDays = q(sims.map((s) => s.bd), 0.5);
    const value = bedDays * D.costs.alcDay;
    const net = q(sims.map((s) => s.net), 0.5);
    return {
      cohort, totalBeds, placed, opexYr, capex, bedDays, value, net,
      admissions: bedDays / D.costs.avgLos,
      costPerNight: totalBeds ? opexYr / (totalBeds * 365) : 0,
      bd10: q(sims.map((s) => s.bd), 0.1), bd90: q(sims.map((s) => s.bd), 0.9),
      net10: q(sims.map((s) => s.net), 0.1), net90: q(sims.map((s) => s.net), 0.9),
    };
  }

  function contracts() {
    const rows = D.contracts.map((c) => ({ ...c, empty: Math.round(c.units * (1 - c.occ90)) }));
    const empty = rows.reduce((a, c) => a + c.empty, 0);
    return { rows, empty, costYr: rows.reduce((a, c) => a + c.empty * c.costNight * 365, 0) };
  }

  function runAll() {
    const cen = census();
    const cap = capacity();
    const m = match();
    const s = srm(m.taken);
    const h = hah();
    const rem = remaining(m.taken);
    const released = m.matches.length + s.length + h.eligible.length;
    return { cen, cap, matches: m.matches, srm: s, hah: h, rem, released,
      valueDay: released * D.costs.alcDay, valueYr: released * D.costs.alcDay * 365,
      mismatches: D.mismatches, contracts: contracts(), abi: abiCohort() };
  }

  return { census, capacity, runAll, abiModel, abiCohort, km, siteById, nodeById };
})();
if (typeof module !== 'undefined') module.exports = { Engine };

const MAP = { w: 600, h: 450, lonMin: -123.27, lonMax: -123.035, latMin: 49.147, latMax: 49.338 }; // schematic: vertical scale compressed

const px = (p) => [(p.lon - MAP.lonMin) / (MAP.lonMax - MAP.lonMin) * MAP.w, (MAP.latMax - p.lat) / (MAP.latMax - MAP.latMin) * MAP.h];

function mapHTML() {

  const hoods = D.neighbourhoods.map(([n, lat, lon]) => { const [x, y] = px({ lat, lon }); return `<text x="${x}" y="${y}" text-anchor="middle" font-size="10" letter-spacing="1.2" fill="#9db0bf" font-family="IBM Plex Sans, sans-serif">${n.toUpperCase()}</text>`; }).join('');

function curve(a, b, bend = 0.18) {
  const [x1, y1] = a, [x2, y2] = b; const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  const dx = x2 - x1, dy = y2 - y1; return `M${x1.toFixed(1)} ${y1.toFixed(1)} Q${(mx - dy * bend).toFixed(1)} ${(my + dx * bend).toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
}
function homeSpot(p, i) { const [x, y] = px(site(p.site)); const a = (i * 2.4) + (p.id.length % 3); return [x + Math.cos(a) * 48, y + Math.sin(a) * 40]; }
function linesHTML(part) {
  const anim = S.run === 'running';
  const st = (len, delay) => anim ? `stroke-dasharray="${len}" stroke-dashoffset="${len}" style="animation-delay:${delay}s"` : '';
  let out = '';
  if ((part === undefined && S.shown.lines) || part === 'lines') {
    out += R.matches.map((m, i) => { const s = site(m.patient.site); if (s.coastal) return ''; return `<path class="mline" d="${curve(px(s), px(m.node))}" stroke="#7d9800" ${st(500, i * 0.08)}/>`; }).join('');
  }
  const homes = (list, col, key) => list.map((p, i) => { const s = site(p.site); if (s.coastal) return ''; const h = homeSpot(p, i + (key === 'srm' ? 7 : 0));
    return `<path class="mline" d="${curve(px(s), h, 0.3)}" stroke="${col}" ${anim ? `stroke-dasharray="300" stroke-dashoffset="300" style="animation-delay:${i * 0.1}s"` : 'stroke-dasharray="4 4"'}/>
      <path class="popin" d="M${(h[0] - 5).toFixed(1)} ${(h[1] + 4).toFixed(1)} v-5 l5 -5 l5 5 v5 z" fill="${col}"/>`; }).join('');
  if ((part === undefined && S.shown.hah) || part === 'hah') out += homes(R.hah.eligible, '#0078ae', 'hah');
  if ((part === undefined && S.shown.srm) || part === 'srm') out += homes(R.srm, '#6a5ca8', 'srm');
  return out;
}

let runTimer = null;
function runEngine() {
  if (S.run !== 'idle') return;
  S.run = 'running'; S.feed = []; S.released = 0; S.shown = { lines: false, hah: false, srm: false, opps: [] };
  render();
  const steps = STEPS();
  let i = 0;
  const next = () => {
    if (i >= steps.length) return finishEngine();
    const st = steps[i++];
    S.feed.push(st);
    const feed = $('feed');
    if (feed) { if (S.feed.length === 1) feed.innerHTML = ''; feed.insertAdjacentHTML('beforeend', feedItem(st)); feed.scrollTop = feed.scrollHeight; }
    if (st.on) { S.shown[st.on] = true; const g = $('mapLines'); if (g) g.insertAdjacentHTML('beforeend', linesHTML(st.on)); }
    if (st.add) countUp(S.released, S.released + st.add), S.released += st.add;
    if (st.opp) { S.shown.opps.push(st.opp); const ol = $('oppList'); const o = OPPS.find((x) => x.id === st.opp); if (ol && o) ol.insertAdjacentHTML('beforeend', oppHTML(o)); }
    runTimer = setTimeout(next, reduced() ? 60 : st.think ? 1100 : 950);
  };
  next();
}
function countUp(from, to) {
  const el = $('releasedBig'); if (!el) return;
  const t0 = performance.now(), dur = reduced() ? 1 : 700;
  const step = (t) => { const k = Math.min(1, (t - t0) / dur); el.textContent = Math.round(from + (to - from) * k); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function finishEngine() {
  clearTimeout(runTimer);
  S.run = 'done'; S.released = R.released; S.feed = STEPS(); S.shown = { lines: true, hah: true, srm: true, opps: OPPS.map((o) => o.id) };
  render();
  toast(`${R.released} acute beds released today, pending sign-off`);
}
function skipEngine() { finishEngine(); }
function ensureRun() { if (S.run === 'idle') { S.run = 'done'; S.released = R.released; S.feed = STEPS(); S.shown = { lines: true, hah: true, srm: true, opps: OPPS.map((o) => o.id) }; } }

function rangeBar(lo, mid, hi, max) {
  const p = (v) => Math.max(0, Math.min(100, v / max * 100));
  return `<div class="range"><span style="left:${p(lo)}%;width:${(p(hi) - p(lo)).toFixed(1)}%"></span><i style="left:calc(${p(mid)}% - 1px)"></i></div>`;
}
function resultsHTML(m) {
  return `<div style="display:flex;gap:10px;align-items:center;margin-bottom:12px"><span class="pill ocean">${m.totalBeds} new places</span><span class="pill ${m.placed >= R.abi.n ? 'good' : 'warn'}">places ${m.placed} of ${R.abi.n} people</span></div>

      <div class="metric"><div class="lab">Room for more admissions a year</div><div class="v">${n0(m.admissions)}</div><div class="r" ${tip('Bed-days released ÷ 8.1-day average stay (C.D. Howe Institute).', 'costs.avg_los')}>at an 8.1-day average stay</div></div>
      <div class="metric"><div class="lab">Blended cost per night</div><div class="v">${m.totalBeds ? money(m.costPerNight) : '–'}</div><div class="r">vs ${money(D.costs.alcDay)} in acute care</div></div>
      <div class="metric"><div class="lab">Cost to run a year</div><div class="v">${moneyM(m.opexYr)}</div><div class="r">plus ${m.capex ? moneyM(m.capex) + ' one-time capital' : 'no capital'}</div></div>
      <div class="metric"><div class="lab">Acute capacity released, value a year</div><div class="v">${moneyM(m.value)}</div><div class="r">at $1,090 per ALC day</div></div>
      <div class="metric"><div class="lab">Net capacity value a year</div><div class="v" style="color:${m.net >= 0 ? 'var(--good)' : 'var(--crit)'}">${moneyM(m.net)}</div>${rangeBar(Math.max(0, m.net10), Math.max(0, m.net), Math.max(0, m.net90), Math.max(5e6, m.net90))}<div class="r">${moneyM(m.net10)} to ${moneyM(m.net90)}</div></div>
    </div>
    <div class="srcnote">Ranges come from 800 simulations varying occupancy, placement breakdown (up to 15%) and operating cost (±16%). Unit costs are illustrative until CHORDS completes VCH’s cost-per-bed work. Released capacity refills with other patients; it is not a cash saving.</div>`;
}
function memoParts(m) {
  if (!m.totalBeds) return null;
  const parts = [];
  const mix = [];
  if (S.sl.B) mix.push(`${S.sl.B} in a VCH-run small complex-care home`);
  if (S.sl.A) mix.push(`${S.sl.A} contracted secured beds`);
  if (S.sl.C) mix.push(`${S.sl.C} enhanced supported-housing units`);
  parts.push(['Recommendation', `For the ${R.abi.n} people with a brain injury and neuropsychiatric needs now waiting in acute care, create ${m.totalBeds} places: ${mix.join(', ')}. This places ${m.placed} of ${R.abi.n} people.`]);
  parts.push(['Effect on acute care', `About ${n0(m.bedDays)} acute bed-days released a year (80% range ${n0(m.bd10)} to ${n0(m.bd90)}), room for about ${n0(m.admissions)} more admissions, worth ${moneyM(m.value)} a year at a conservative $1,090 per ALC day.¹`]);
  parts.push(['Cost', `${moneyM(m.opexYr)} a year to operate, a blended ${money(m.costPerNight)} per bed-night against $1,090 in acute care.²${m.capex ? ` One-time capital of ${moneyM(m.capex)} for the home.³` : ''} Net capacity value ${moneyM(m.net)} a year (80% range ${moneyM(m.net10)} to ${moneyM(m.net90)}).`]);
  parts.push(['Caveats', 'Unit costs are illustrative until CHORDS completes VCH’s cost-per-bed work. Ranges reflect occupancy, placement breakdown and operating cost. Draft for discussion; requires sign-off.']);
  return parts;
}
function memoHTML(m) {
  const parts = memoParts(m);
  if (!parts) return '<p>Set at least one option above zero to see its effect.</p>';
  const sup = { '¹': tip('Sutherland et al. 2019 estimate, 2016 dollars. Conservative.', 'costs.alc_day'), '²': tip('Illustrative unit costs by bed type.', 'finance.unit_costs'), '³': tip('Purchase and retrofit of a residential property. Illustrative.', 'capital.estimate') };
  return parts.map(([h, t]) => `<p><b>${h}.</b> ${esc(t).replace(/[¹²³]/g, (c) => `<sup ${sup[c]}>${c === '¹' ? 1 : c === '²' ? 2 : 3}</sup>`)}</p>`).join('');
}
function setSl(k, v) {
  S.sl[k] = k === 'occ' ? +v : Math.round(+v);
  const m = Engine.abiModel({ A: S.sl.A, B: S.sl.B, C: S.sl.C }, S.sl.occ);

  $('resCard').innerHTML = resultsHTML(m);
  $('memo').innerHTML = memoHTML(m);
}
function copyMemo() {
  const parts = memoParts(Engine.abiModel({ A: S.sl.A, B: S.sl.B, C: S.sl.C }, S.sl.occ));
  const text = parts ? parts.map(([h, t]) => `${h}. ${t.replace(/[¹²³]/g, '')}`).join('\n\n') : '';
  try { navigator.clipboard.writeText(text).then(() => toast('Memo text copied'), () => toast('Copy was blocked by the browser')); } catch (e) { toast('Copy was blocked by the browser'); }
}

function openSettings() { S.settings = true; render(); const i = $('donorIn'); if (i) i.focus(); }
function closeSettings() { S.settings = false; render(); }
function saveSettings() { S.donor = $('donorIn').value.trim().slice(0, 60); S.notes = $('notesIn').checked; store.set('donor', S.donor); store.set('notes', S.notes); S.settings = false; render(); }
function toggleNotes() { S.notes = !S.notes; store.set('notes', S.notes); render(); }
function replayEngine() { clearTimeout(runTimer); S.run = 'idle'; S.feed = []; S.released = 0; S.shown = { lines: false, hah: false, srm: false, opps: [] }; S.settings = false; go(2); render(); }
function resetDemo() { clearTimeout(runTimer); Object.assign(S, { run: 'idle', feed: [], released: 0, shown: { lines: false, hah: false, srm: false, opps: [] }, selected: 'margaret', pkg: {}, sent: {}, sl: { A: 6, B: 10, C: 6, occ: 0.9 }, settings: false }); go(1); render(); }
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.innerHTML = `<i></i>${esc(msg)}`;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3400);
}
function afterRender() { /* hook for future per-scene effects */ }

document.addEventListener('mouseover', (e) => {
  const el = e.target.closest ? e.target.closest('[data-tip]') : null; const tt = $('tooltip');
  if (!el) { tt.style.display = 'none'; return; }
  tt.innerHTML = esc(el.getAttribute('data-tip')) + (el.getAttribute('data-src') ? `<div class="s">source: ${esc(el.getAttribute('data-src'))}</div>` : '');
  tt.style.display = 'block';
});
document.addEventListener('mousemove', (e) => {
  const tt = $('tooltip'); if (tt.style.display !== 'block') return;
  const x = Math.min(e.clientX + 14, window.innerWidth - 340), y = Math.min(e.clientY + 14, window.innerHeight - 90);
  tt.style.left = x + 'px'; tt.style.top = y + 'px';
});
document.addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) { if (e.key === 'Escape') closeSettings(); return; }
  if (S.settings) { if (e.key === 'Escape') closeSettings(); return; }
  if (e.key === 'ArrowRight' || e.key === 'PageDown') go(S.scene + 1);
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(S.scene - 1);
  else if (/^[1-5]$/.test(e.key)) go(+e.key);
  else if (e.key === 'n' || e.key === 'N') toggleNotes();
  else if ((e.key === 'r' || e.key === 'R') && S.scene === 2) runEngine();
});

fromHash();

</script>

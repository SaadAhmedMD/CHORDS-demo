/* The command centre at night. Same palette and type as the pitch deck: ink ground, cream text, amber for what is open or
   actionable, blue for people waiting in acute care, coral where nothing fits. The one painted surface is the map. */
:root {
  --ground: #0E1626; --deep: #0A111D; --panel: rgba(20,30,49,.88); --panel2: rgba(255,255,255,.04);
  --light: #EEE8DD; --body: #BAC3CF; --muted: #8C97A8;
  --line: rgba(255,255,255,.13); --line2: rgba(255,255,255,.07);
  --amber: #E3A857; --amberL: #F2C97A; --blue: #8DB8E0; --blueL: #B6D2EC; --coral: #E58C6E; --sage: #9CC8A6; --mauve: #C3A6D8; --teal: #7FC4C0; --rose: #E9A3B5;
  --sans: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--body); font-family: var(--sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ''; position: fixed; inset: 0; z-index: -1; background: var(--page-art, none) center / cover no-repeat, var(--ground); }
button { font-family: var(--sans); color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--amberL); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
b, strong { color: var(--light); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: rgba(10,17,29,.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); color: var(--light); display: flex; align-items: center; gap: 18px; padding: 10px 22px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex-shrink: 1; }
.brand > div { min-width: 0; }
.brand-name { font-family: var(--serif); font-weight: 400; font-size: 18px; line-height: 1.15; color: var(--light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 330px; }
.brand-sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 330px; }
.steps { display: flex; gap: 4px; flex: 1; justify-content: center; flex-wrap: nowrap; }
.step { border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 500; padding: 6px 10px; white-space: nowrap; border-radius: 99px; cursor: pointer; display: flex; align-items: center; gap: 7px; }
.step b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #4C5A70; font-size: 11px; color: inherit; }
.step:hover { background: rgba(255,255,255,.06); color: var(--light); }
.step.on { background: rgba(227,168,87,.13); border-color: rgba(227,168,87,.5); color: var(--light); }
.step.on b { border-color: var(--amber); background: var(--amber); color: var(--ground); }
.top-right { display: flex; align-items: center; gap: 8px; }
.chip-demo { font-size: 11px; color: var(--amberL); border: 1px dashed rgba(227,168,87,.55); padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
.tbtn { border: 1px solid var(--line); background: transparent; color: var(--body); font-size: 12px; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
.tbtn:hover, .tbtn.on { background: rgba(255,255,255,.08); color: var(--light); }
.tbtn[disabled] { opacity: .35; cursor: default; }
.tbtn.next { background: var(--amber); border-color: var(--amber); color: var(--ground); font-weight: 700; }
.tbtn.next:hover { background: var(--amberL); }

/* page */
.wrap { max-width: 1480px; margin: 0 auto; padding: 22px 22px 40px; }
.notes-on .wrap { padding-bottom: 110px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--amber); margin-bottom: 6px; }
.title { font-family: var(--serif); font-size: 40px; font-weight: 300; line-height: 1.08; letter-spacing: -.6px; color: var(--light); }
.subtitle { color: var(--body); margin: 8px 0 0; max-width: 76ch; font-size: 15px; }
.btn { border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--light); font-weight: 600; font-size: 13px; padding: 9px 14px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--amber); }
.btn.primary, .btn.lime { background: var(--amber); border-color: var(--amber); color: var(--ground); font-weight: 700; }
.btn.primary:hover, .btn.lime:hover { background: var(--amberL); border-color: var(--amberL); }
.btn[disabled] { opacity: .55; cursor: default; }

.grid { display: grid; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.card.bleed { overflow: hidden; }
.card.inset { background: var(--panel2); }
.card h3 { font-size: 13px; font-weight: 600; color: var(--light); display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.card h3 small { font-weight: 400; color: var(--muted); font-size: 12px; }

/* headline figures: ruled, not boxed */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 26px; margin-bottom: 18px; }
.tile { border-top: 2px solid rgba(255,255,255,.28); padding: 12px 0 2px; }
.tile .lab { font-size: 12.5px; color: var(--body); font-weight: 500; }
.tile .big { font-family: var(--serif); font-size: 50px; font-weight: 300; color: var(--light); line-height: 1.08; margin: 2px 0 4px; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.tile .sub { font-size: 12px; color: var(--muted); }
.tile.alert { border-top-color: var(--coral); } .tile.alert .big { color: var(--coral); }
.tile.good { border-top-color: var(--sage); } .tile.good .big { color: var(--sage); }
.tile.lime { border-top-color: var(--amber); } .tile.lime .big { color: var(--amber); }

/* live sources */
.feeds { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -4px 0 16px; font-size: 12px; color: var(--muted); }
.feed { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 99px; padding: 4px 11px; color: var(--body); white-space: nowrap; }
.feed i { width: 7px; height: 7px; border-radius: 50%; background: var(--sage); }
.feed.s1 { border-color: rgba(141,184,224,.6); color: var(--blueL); }
.feed.s1 i { background: var(--blue); }

/* map */
.mapwrap { position: relative; }
.map svg { width: 100%; height: auto; display: block; border-radius: 10px; background: var(--map-art, none) center / 100% 100% no-repeat, #0B1424; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11.5px; color: var(--body); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.mline { fill: none; stroke-width: 2; stroke-linecap: round; animation: draw 1.1s ease forwards; }
@keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.popin { transform-box: fill-box; transform-origin: center; animation: pop .45s ease both; }
@keyframes pulse { 0%,100% { opacity: .22; } 50% { opacity: .7; } }
.halo { animation: pulse 2.4s ease-in-out infinite; }

/* tables and bars */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .04em; padding: 6px 6px; border-bottom: 1px solid var(--line); }
td { padding: 7px 6px; border-bottom: 1px solid var(--line2); font-size: 13px; vertical-align: middle; color: var(--body); }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: rgba(255,255,255,.05); color: var(--body); border: 1px solid var(--line); white-space: nowrap; }
.pill.open { background: rgba(227,168,87,.16); border-color: rgba(227,168,87,.55); color: var(--amberL); }
.pill.zero { background: rgba(229,140,110,.13); border-color: rgba(229,140,110,.5); color: var(--coral); }
.pill.good { background: rgba(156,200,166,.13); border-color: rgba(156,200,166,.5); color: var(--sage); }
.pill.ocean { background: rgba(141,184,224,.13); border-color: rgba(141,184,224,.5); color: var(--blueL); }
.pill.warn { background: rgba(227,168,87,.1); border-color: rgba(227,168,87,.5); color: var(--amberL); }
.pill.home { background: rgba(195,166,216,.12); border-color: rgba(195,166,216,.5); color: var(--mauve); }
.bar { height: 8px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--blue); border-radius: 99px; }
.srcnote { font-size: 11.5px; color: var(--muted); margin-top: 10px; }
.tight td { padding: 5px 6px; }

/* engine panel */
.cc { display: grid; grid-template-columns: minmax(0,1fr); gap: 14px; }
.cc.withEngine { grid-template-columns: minmax(0,1fr) 380px; }
.engine { background: var(--deep); color: var(--body); border-radius: 14px; border: 1px solid rgba(227,168,87,.32); display: flex; flex-direction: column; min-height: 560px; position: sticky; top: 72px; max-height: calc(100vh - 90px); }
.engine-h { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.engine-h .t { font-family: var(--serif); font-size: 18px; font-weight: 400; color: var(--light); }
.engine-h .s { font-size: 11.5px; color: var(--muted); }
.engine-feed { flex: 1; overflow-y: auto; padding: 12px 16px; font-family: var(--mono); font-size: 12px; line-height: 1.55; }
.engine-feed .think { color: var(--body); font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 14.5px; line-height: 1.4; margin: 8px 0 10px; }
.engine-feed .tool { margin-bottom: 9px; animation: rise .3s ease both; }
.engine-feed .tool .n { color: var(--amberL); }
.engine-feed .tool .src { color: var(--blue); opacity: .8; }
.engine-feed .tool .fres { color: var(--light); padding-left: 14px; }
.engine-f { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.engine-f .stat { font-size: 12px; color: var(--muted); }
.engine-f .stat b { font-family: var(--serif); font-weight: 300; color: var(--sage); font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
@keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.spin { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); animation: pulse 1s infinite; display: inline-block; margin-right: 4px; }

/* opportunities */
.opp { display: grid; grid-template-columns: 4px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--line2); animation: rise .35s ease both; }
.opp:last-child { border-bottom: 0; }
.opp .sev { width: 4px; height: 36px; border-radius: 4px; }
.opp .ot { font-weight: 600; color: var(--light); }
.opp .os { font-size: 12px; color: var(--muted); }

/* person */
.person { display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 14px; align-items: start; }
.plist .grp { font-size: 11.5px; font-weight: 600; color: var(--amber); padding: 12px 12px 6px; }
.prow { width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 12px; border-left: 3px solid transparent; cursor: pointer; display: block; border-bottom: 1px solid var(--line2); }
.prow:hover { background: rgba(255,255,255,.04); }
.prow.on { background: rgba(227,168,87,.1); border-left-color: var(--amber); }
.prow .pn { font-weight: 600; color: var(--light); font-size: 13.5px; }
.prow .pd { font-size: 12px; color: var(--muted); }
.ph { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.ph h2 { font-family: var(--serif); font-weight: 300; font-size: 28px; color: var(--light); }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: rgba(141,184,224,.14); border: 1px solid rgba(141,184,224,.45); color: var(--blueL); display: grid; place-items: center; font-family: var(--serif); font-size: 18px; }
.pmeta { font-size: 12px; color: var(--muted); }
.hero { position: relative; min-height: 236px; margin: -16px -16px 18px; padding: 26px 26px 22px; display: flex; flex-direction: column; justify-content: flex-end; background: #080C14; border-bottom: 1px solid var(--line); }
.hero .art { position: absolute; top: 0; right: 0; bottom: 0; width: 64%; background-size: cover; background-position: right 24%; -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 46%); mask-image: linear-gradient(90deg, transparent 0%, #000 46%); }
.hero > *:not(.art) { position: relative; }
.hero .cap { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 19px; color: var(--amberL); margin-bottom: 6px; }
.hero h2 { font-family: var(--serif); font-weight: 300; font-size: 44px; line-height: 1.05; letter-spacing: -.8px; color: var(--light); margin-bottom: 8px; }
.need { display: grid; grid-template-columns: 1fr 120px; gap: 10px; align-items: center; font-size: 13px; padding: 4px 0; }
.fit { display: grid; grid-template-columns: 22px 170px 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line2); font-size: 13px; align-items: center; }
.fit .x { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.fit .x.no { background: rgba(229,140,110,.16); color: var(--coral); }
.fit .x.yes { background: rgba(156,200,166,.16); color: var(--sage); }
.pkg { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.pkg div { border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.pkg div.done { border-style: solid; border-color: rgba(156,200,166,.5); background: rgba(156,200,166,.1); color: var(--sage); animation: rise .25s ease both; }
.callout { background: rgba(229,140,110,.09); border: 1px solid rgba(229,140,110,.4); color: var(--light); border-radius: 12px; padding: 16px 18px; font-size: 15px; }
.callout b { color: var(--coral); }

/* options */
.opts { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
.opt { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--panel); display: flex; flex-direction: column; gap: 6px; }
.opt.sq { background: rgba(229,140,110,.07); border-color: rgba(229,140,110,.35); }
.opt .on { font-family: var(--serif); font-size: 19px; font-weight: 400; line-height: 1.2; color: var(--light); }
.opt .os { font-size: 12px; color: var(--muted); min-height: 34px; }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; border-top: 1px solid var(--line2); padding-top: 5px; }
.kv span:first-child { color: var(--muted); }
.kv b { font-variant-numeric: tabular-nums; text-align: right; }
.slider { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.slider input, input[type=range] { accent-color: var(--amber); }
.slider input { flex: 1; }
.slider output { font-family: var(--serif); font-size: 20px; color: var(--amber); min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
.res { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px 14px; }
.metric .lab { font-size: 12px; color: var(--muted); }
.metric .v { font-family: var(--serif); font-size: 30px; font-weight: 300; color: var(--light); line-height: 1.15; font-variant-numeric: tabular-nums; }
.metric .r { font-size: 11.5px; color: var(--body); }
.range { position: relative; height: 10px; background: rgba(255,255,255,.08); border-radius: 99px; margin-top: 6px; }
.range span { position: absolute; top: 0; height: 10px; background: rgba(141,184,224,.55); border-radius: 99px; }
.range i { position: absolute; top: -3px; width: 3px; height: 16px; background: var(--light); border-radius: 2px; }
.memo { font-family: var(--serif); font-weight: 300; font-size: 15.5px; line-height: 1.62; color: var(--light); }
.memo p { margin: 0 0 10px; max-width: 72ch; }
.memo b { font-weight: 600; }
sup[data-tip] { color: var(--amber); cursor: help; font-family: var(--sans); font-weight: 600; font-size: 10px; }

/* gift */
.wins { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; margin-bottom: 14px; }
.win { border-top: 3px solid var(--wc); display: flex; flex-direction: column; gap: 10px; }
.win.w1 { --wc: var(--blue); } .win.w2 { --wc: var(--amber); } .win.w3 { --wc: var(--coral); }
.win .wl { font-size: 12px; font-weight: 600; color: var(--wc); }
.win h2 { font-family: var(--serif); font-size: 27px; font-weight: 300; line-height: 1.12; color: var(--light); }
.win dl { margin: 0; display: grid; gap: 8px; }
.win dt { font-size: 11.5px; color: var(--muted); }
.win dd { margin: 0; font-size: 13.5px; color: var(--body); }
.win .when { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 4px; }
.win .when span { font-size: 11.5px; font-weight: 600; color: var(--wc); border: 1px solid var(--wc); border-radius: 99px; padding: 2px 10px; }
.gift { display: grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1fr); gap: 14px; }
.figs td:first-child { font-family: var(--serif); font-size: 22px; font-weight: 300; color: var(--amber); white-space: nowrap; width: 84px; font-variant-numeric: tabular-nums; }
.endcard { position: relative; overflow: hidden; background: var(--ember-art, none) center / cover no-repeat, var(--deep); border: 1px solid rgba(227,168,87,.5); color: var(--light); border-radius: 18px; padding: 30px 32px; display: grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1fr); gap: 28px; align-items: center; margin-top: 14px; }
.endcard .nm { font-family: var(--serif); font-size: 46px; font-weight: 300; line-height: 1.06; letter-spacing: -.8px; text-wrap: balance; }
.endcard .nm i { color: var(--amberL); border-bottom: 2px dashed rgba(242,201,122,.55); }
.endcard .by { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 20px; color: var(--amberL); margin: 12px 0 0; }
.endcard p { color: var(--body); margin: 10px 0 0; max-width: 58ch; font-size: 14.5px; }
.tier { background: rgba(10,17,29,.72); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
.tier:last-child { margin-bottom: 0; border-color: rgba(227,168,87,.6); }
.tier .a { font-family: var(--serif); font-size: 36px; font-weight: 300; line-height: 1.1; color: var(--light); }
.tier .d { font-size: 12.5px; color: var(--body); margin-top: 4px; }

/* notes, modal, tooltip, toast */
.notes { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: #191610; border-top: 1px solid rgba(227,168,87,.55); padding: 10px 22px 12px; font-size: 13.5px; color: #E9DDC3; display: flex; gap: 14px; align-items: flex-start; }
.notes b { white-space: nowrap; color: var(--amberL); }
.modal-bg { position: fixed; inset: 0; background: rgba(4,8,14,.66); z-index: 40; display: grid; place-items: center; }
.modal { background: #141E31; border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(460px, 92vw); }
.modal h2 { font-family: var(--serif); font-weight: 400; font-size: 20px; color: var(--light); }
.modal label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
.modal input[type=text] { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: var(--deep); color: var(--light); }
#tooltip { position: fixed; z-index: 60; max-width: 320px; background: #05090F; border: 1px solid var(--line); color: var(--light); font-size: 12px; line-height: 1.5; padding: 8px 11px; border-radius: 8px; pointer-events: none; display: none; box-shadow: 0 10px 28px rgba(0,0,0,.5); }
#tooltip .s { font-family: var(--mono); font-size: 10.5px; color: var(--amberL); margin-top: 4px; }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 50; background: #05090F; border: 1px solid rgba(156,200,166,.5); color: var(--light); padding: 11px 18px; border-radius: 10px; font-size: 13px; display: flex; gap: 9px; align-items: center; box-shadow: 0 12px 32px rgba(0,0,0,.5); animation: rise .25s ease both; }
.toast i { width: 9px; height: 9px; border-radius: 50%; background: var(--sage); display: inline-block; }

.settled .opp, .settled .tool, .settled .popin { animation: none; }

@media (max-width: 1360px) {
  .step:not(.on) span { display: none; }
}
@media (max-width: 1150px) {
  .cc.withEngine { grid-template-columns: minmax(0,1fr); }
  .engine { position: static; max-height: none; min-height: 360px; }
  .tiles { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .opts { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .gift, .endcard, .wins { grid-template-columns: minmax(0,1fr); }
  .title { font-size: 32px; }
}
@media (max-width: 900px) {
  .wrap .grid { grid-template-columns: minmax(0,1fr) !important; }
}
@media (max-width: 760px) {
  .top { flex-wrap: wrap; gap: 8px 10px; padding: 8px 14px; }
  .brand { flex: 1; }
  .steps { order: 3; flex-basis: 100%; justify-content: space-between; }
  .chip-demo { display: none; }
  .wrap { padding: 16px 14px 40px; }
  .tiles { gap: 16px; }
  .fit { grid-template-columns: 22px 1fr; } .fit span:last-child { grid-column: 2; }
  .callout { flex-direction: column; align-items: flex-start !important; }
  .person { grid-template-columns: minmax(0,1fr); }
  .res { grid-template-columns: minmax(0,1fr); }
  .opts { grid-template-columns: minmax(0,1fr); }
  .step span { display: none; }
  .head { flex-direction: column; align-items: flex-start; }
  .hero .art { width: 100%; opacity: .5; }
  .hero h2 { font-size: 34px; } .endcard .nm { font-size: 34px; } .tile .big { font-size: 38px; }
  .brand-sub { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; }
}


/* ============================================================
   The wall: operations view. One 1600 × 900 canvas scaled to the
   screen, so it never scrolls. Same ink, cream and amber as the
   tour; sage, amber and coral carry green, amber and red.
   ============================================================ */
body.ops { overflow: hidden; }
.opsapp { position: fixed; inset: 0; }
.wall { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; display: grid; grid-template-rows: 52px 38px minmax(0, 1fr); font-size: 13px; line-height: 1.35; color: var(--body); }
.wall button { font-size: inherit; }
.mut { color: var(--muted); }
.c-g { color: var(--sage); } .c-a, .c-o { color: var(--amberL); } .c-r { color: var(--coral); } .c-b { color: var(--blueL); }
.f-g { background: var(--sage); } .f-a { background: var(--amber); } .f-r { background: var(--coral); } .f-b { background: var(--blue); } .f-o { background: var(--amber); }

/* top bar: brand, function tabs, modes */
.otop { display: flex; align-items: center; gap: 16px; padding: 0 16px; background: rgba(10,17,29,.92); border-bottom: 1px solid var(--line); color: var(--light); min-width: 0; }
.otop .brand-name { font-size: 17px; max-width: 300px; }
.otop .brand-sub { font-size: 11px; max-width: 300px; }
.otabs { display: flex; gap: 4px; flex: 1; justify-content: center; }
.otab { border: 1px solid transparent; background: transparent; color: var(--body); font-weight: 600; font-size: 13px !important; padding: 7px 10px 7px 13px; border-radius: 9px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.otab:hover { background: rgba(255,255,255,.06); color: var(--light); }
.otab.on { background: rgba(227,168,87,.13); border-color: rgba(227,168,87,.5); color: var(--light); }
.bdg { min-width: 22px; padding: 1px 6px; border-radius: 99px; font-size: 11px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.bdg.b-r { background: rgba(229,140,110,.2); color: var(--coral); } .bdg.b-a { background: rgba(227,168,87,.18); color: var(--amberL); } .bdg.b-g { background: rgba(156,200,166,.16); color: var(--sage); }
.otop .tbtn { font-size: 12px !important; white-space: nowrap; }
.tbtn.hudbtn { border-color: rgba(227,168,87,.55); color: var(--amberL); font-weight: 600; }
.tbtn.hudbtn.on { background: var(--amber); color: var(--ground); }
.tbtn.hudbtn small { color: var(--body); font-weight: 400; margin-left: 4px; }

/* status bar: clock, surge level, last refresh per source */
.ostat { display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--deep); border-bottom: 1px solid var(--line); font-size: 11.5px; white-space: nowrap; min-width: 0; }
.oclock { display: flex; align-items: baseline; gap: 8px; }
.oclock b { font-size: 21px; font-weight: 600; color: var(--light); letter-spacing: .5px; }
.oclock span { color: var(--muted); }
.osurge { display: flex; align-items: baseline; gap: 8px; padding: 3px 12px; border-radius: 8px; border: 1px solid var(--sc); background: color-mix(in srgb, var(--sc) 13%, transparent); --sc: var(--sage); }
.osurge.lv2 { --sc: var(--amber); } .osurge.lv3, .osurge.lv4 { --sc: var(--coral); }
.osurge > b { text-transform: uppercase; letter-spacing: .1em; font-size: 11px; color: var(--sc); }
.osurge > span { color: var(--light); font-weight: 600; font-size: 12.5px; }
.osurge small { color: var(--body); font-size: 11px; }
.osrcs { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; min-width: 0; overflow: hidden; }
.osl { color: var(--muted); margin-right: 3px; text-transform: uppercase; letter-spacing: .1em; font-size: 10px; }
.osrc { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 99px; padding: 2px 8px; color: var(--body); font-size: 11px; }
.osrc i { width: 6px; height: 6px; border-radius: 50%; background: var(--sage); }
.osrc b, .osrc .tmr { color: var(--light); font-weight: 600; }
.osrc.late i, .osrc:has(.t-a) i { background: var(--amber); }
.osrc.late, .osrc:has(.t-a) { border-color: rgba(227,168,87,.55); }
.oeng { color: var(--muted); } .oeng b, .oeng .tmr { color: var(--light); font-weight: 600; }

/* panels */
.obody { padding: 12px 14px; min-height: 0; min-width: 0; position: relative; }
.ocol { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
.opanel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; }
.grow { flex: 1; }
.oh { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; min-width: 0; }
.oh h3 { font-size: 13px; font-weight: 600; color: var(--light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.oh h3 small { font-weight: 400; color: var(--muted); font-size: 11.5px; margin-left: 4px; }
.ohr { font-size: 11.5px; white-space: nowrap; }
.ohr .big { font-family: var(--serif); font-size: 24px; font-weight: 300; color: var(--light); line-height: .9; }
.ohr .big.c-o { color: var(--amber); }
.osub { display: flex; gap: 14px; font-size: 11.5px; color: var(--body); margin: -2px 0 6px; align-items: baseline; }
.osub b { color: var(--light); } .osub .c-r b { color: var(--coral); }
.osec { font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--amber); font-weight: 600; margin: 9px 0 3px; }
.olink { margin-left: auto; background: none; border: 0; color: var(--amberL); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
.obtn { border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--light); font-weight: 600; font-size: 11.5px !important; padding: 4px 9px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.obtn:hover { border-color: var(--amber); }
.obtn.pri { background: var(--amber); border-color: var(--amber); color: var(--ground); }
.obtn.pri:hover { background: var(--amberL); }
.obtn[disabled] { opacity: .4; cursor: default; }
.wall .pill { font-size: 10.5px; padding: 1px 8px; }
.tmr { font-variant-numeric: tabular-nums; }

.in-huddle [data-p] { transition: opacity .35s ease; }
.in-huddle .dim { opacity: .22; }
.hud { position: absolute; bottom: 16px; width: 450px; z-index: 30; background: #141E31; border: 1px solid rgba(227,168,87,.65); border-radius: 14px; padding: 14px 18px 14px; box-shadow: 0 22px 60px rgba(0,0,0,.65); animation: rise .3s ease both; }
.hud.side-r { right: 16px; } .hud.side-l { left: 16px; }
.hud-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; } .hud-h .eyebrow { margin: 0; }
.hud h2 { font-family: var(--serif); font-weight: 300; font-size: 25px; line-height: 1.12; color: var(--light); margin: 6px 0 2px; }
.hud-who { font-size: 11.5px; color: var(--amberL); }
.hud ul { margin: 10px 0 12px; padding: 0 0 0 18px; display: grid; gap: 6px; font-size: 13.5px; color: var(--body); line-height: 1.4; }
.hud-f { display: flex; align-items: center; gap: 8px; }
.hud-dots { display: flex; gap: 5px; margin-right: auto; } .hud-dots button { width: 9px; height: 9px; border-radius: 50%; border: 1px solid #4C5A70; background: transparent; padding: 0; cursor: pointer; } .hud-dots .done { background: #4C5A70; } .hud-dots .on { background: var(--amber); border-color: var(--amber); }

/* tour top bar: way back to the wall */
.tbtn.live { border-color: rgba(227,168,87,.55); color: var(--amberL); font-weight: 600; white-space: nowrap; }
.opsapp.notes-on ~ .x, .opsapp .notes { z-index: 45; }
@media (prefers-reduced-motion: reduce) { .frow.new, .flash, .drawer, .hud { animation: none !important; } }

</style>

const Engine = (() => {
  const D = DATA;
  const siteById = Object.fromEntries(D.sites.map((s) => [s.id, s]));

  const needToType = { ltc: 'ltc', al: 'al', sh: 'sh', home: 'hhs' };

  function km(a, b) {
    const R = 6371, toR = Math.PI / 180;
    const dLat = (b.lat - a.lat) * toR, dLon = (b.lon - a.lon) * toR;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * toR) * Math.cos(b.lat * toR) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }

  function census() {
    const bySite = D.sites.map((s) => ({ ...s, alcCount: D.patients.filter((p) => p.site === s.id).length }));
    const byNeed = {};
    D.patients.forEach((p) => { byNeed[p.need] = (byNeed[p.need] || 0) + 1; });
    const total = D.patients.length;
    const edWaiting = D.sites.reduce((a, s) => a + s.edWaiting, 0);
    return { total, bySite, byNeed, edWaiting, patientDays: D.patients.reduce((a, p) => a + p.days, 0) };

  function capacity() {
    const places = D.portfolio.filter((p) => !p.virtual).reduce((a, p) => a + p.places, 0);

  function match() {
    const taken = new Set();
    const matches = [];
    D.nodes.filter((n) => n.open > 0).forEach((node) => {
      for (let i = 0; i < node.open; i++) {
        const cands = D.patients.filter((p) => !taken.has(p.id) && needToType[p.need] === node.type);
        if (!cands.length) continue;
        cands.sort((a, b) => score(b, node) - score(a, node));
        const p = cands[0];

  function abiCohort() {
    const c = D.patients.filter((p) => p.need === 'abi');
    const avgDays = c.reduce((a, p) => a + p.days, 0) / c.length;
    const sites = new Set(c.map((p) => p.site)).size;
    const bedDaysYr = c.length * 365;
    return { n: c.length, avgDays, sites, bedDaysYr, valueYr: bedDaysYr * D.costs.alcDay, patients: c };
  }

  // Options model with Monte Carlo bounds. beds = {A,B,C}, occ = central occupancy
  function abiModel(beds, occ) {
    const cohort = abiCohort();
    const opts = D.abiOptions;
    const placedRaw = opts.reduce((a, o) => a + Math.min(beds[o.id] || 0, o.maxBeds, o.fits), 0);
    const placed = Math.min(cohort.n, placedRaw);
    const totalBeds = opts.reduce((a, o) => a + (beds[o.id] || 0), 0);
    const opexYr = opts.reduce((a, o) => a + (beds[o.id] || 0) * o.costNight * 365, 0);
    const capex = opts.reduce((a, o) => a + ((beds[o.id] || 0) > 0 ? o.capex : 0), 0);

      const breakdown = r() * 0.15;

    const bedDays = q(sims.map((s) => s.bd), 0.5);

      cohort, totalBeds, placed, opexYr, capex, bedDays, value, net,
      admissions: bedDays / D.costs.avgLos,
      costPerNight: totalBeds ? opexYr / (totalBeds * 365) : 0,

      net10: q(sims.map((s) => s.net), 0.1), net90: q(sims.map((s) => s.net), 0.9),

  }

  function contracts() {
    const rows = D.contracts.map((c) => ({ ...c, empty: Math.round(c.units * (1 - c.occ90)) }));
    const empty = rows.reduce((a, c) => a + c.empty, 0);
    return { rows, empty, costYr: rows.reduce((a, c) => a + c.empty * c.costNight * 365, 0) };
  }

  // people leaving hospital today whose heart failure could be followed on Medly
  function cdm(leaving) {
    const hf = leaving.filter((p) => /heart failure/i.test(p.dx));
    return { n: hf.length, people: hf };
  }

  function runAll() {
    const cen = census();
    const cap = capacity();
    const m = match();
    const s = srm(m.taken);
    const h = hah();
    const rem = remaining(m.taken);
    const released = m.matches.length + s.length + h.eligible.length;
    return { cen, cap, matches: m.matches, srm: s, hah: h, rem, released,
      valueDay: released * D.costs.alcDay, valueYr: released * D.costs.alcDay * 365,
      mismatches: D.mismatches, contracts: contracts(), abi: abiCohort(),
      cdm: cdm([...m.matches.map((x) => x.patient), ...s, ...h.eligible]) };
  }

  return { census, capacity, runAll, abiModel, abiCohort, km, siteById, nodeById };

function curve(a, b, bend = 0.18) {
  const [x1, y1] = a, [x2, y2] = b; const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  const dx = x2 - x1, dy = y2 - y1; return `M${x1.toFixed(1)} ${y1.toFixed(1)} Q${(mx - dy * bend).toFixed(1)} ${(my + dx * bend).toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
}
function homeSpot(p, i) { const [x, y] = px(site(p.site)); const a = (i * 2.4) + (p.id.length % 3); return [x + Math.cos(a) * 48, y + Math.sin(a) * 40]; }
function linesHTML(part) {
  const anim = S.run === 'running';
  const st = (len, delay) => anim ? `stroke-dasharray="${len}" stroke-dashoffset="${len}" style="animation-delay:${delay}s"` : '';
  let out = '';
  if ((part === undefined && S.shown.lines) || part === 'lines') {
    out += R.matches.map((m, i) => { const s = site(m.patient.site); if (s.coastal) return ''; return `<path class="mline" d="${curve(px(s), px(m.node))}" stroke="${PAL.amberL}" ${st(500, i * 0.08)}/>`; }).join('');
  }
  const homes = (list, col, key) => list.map((p, i) => { const s = site(p.site); if (s.coastal) return ''; const h = homeSpot(p, i + (key === 'srm' ? 7 : 0));
    return `<path class="mline" d="${curve(px(s), h, 0.3)}" stroke="${col}" ${anim ? `stroke-dasharray="300" stroke-dashoffset="300" style="animation-delay:${i * 0.1}s"` : 'stroke-dasharray="4 4"'}/>
      <path class="popin" d="M${(h[0] - 5).toFixed(1)} ${(h[1] + 4).toFixed(1)} v-5 l5 -5 l5 5 v5 z" fill="${col}" stroke="#0A111D" stroke-width="1.4" paint-order="stroke"/>`; }).join('');
  if ((part === undefined && S.shown.hah) || part === 'hah') out += homes(R.hah.eligible, PAL.blue, 'hah');
  if ((part === undefined && S.shown.srm) || part === 'srm') out += homes(R.srm, PAL.mauve, 'srm');
  return out;
}

let runTimer = null;
function runEngine() {
  if (S.run !== 'idle') return;
  S.run = 'running'; S.feed = []; S.released = 0; S.shown = { lines: false, hah: false, srm: false, opps: [] };
  render();
  const steps = STEPS();
  let i = 0;
  const next = () => {
    if (i >= steps.length) return finishEngine();
    const st = steps[i++];
    S.feed.push(st);
    const feed = $('feed');
    if (feed) { if (S.feed.length === 1) feed.innerHTML = ''; feed.insertAdjacentHTML('beforeend', feedItem(st)); feed.scrollTop = feed.scrollHeight; }
    if (st.on) { S.shown[st.on] = true; const g = $('mapLines'); if (g) g.insertAdjacentHTML('beforeend', linesHTML(st.on)); }
    if (st.add) countUp(S.released, S.released + st.add), S.released += st.add;
    if (st.opp) { S.shown.opps.push(st.opp); const ol = $('oppList'); const o = OPPS.find((x) => x.id === st.opp); if (ol && o) ol.insertAdjacentHTML('beforeend', (S.mode === 'ops' ? engOppHTML : oppHTML)(o)); }
    runTimer = setTimeout(next, reduced() ? 60 : st.think ? 1000 : 820);
  };
  next();
}
function countUp(from, to) {
  const el = $('releasedBig'); if (!el) return;
  const t0 = performance.now(), dur = reduced() ? 1 : 700;
  const step = (t) => { const k = Math.min(1, (t - t0) / dur); el.textContent = Math.round(from + (to - from) * k); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function rangeBar(lo, mid, hi, max) {

function resultsHTML(m) {

function memoParts(m) {
  if (!m.totalBeds) return null;
  const parts = [];
  const mix = [];
  if (S.sl.B) mix.push(`${S.sl.B} in a VCH-run small complex-care home`);
  if (S.sl.A) mix.push(`${S.sl.A} contracted secured beds`);
  if (S.sl.C) mix.push(`${S.sl.C} enhanced supported-housing units`);
  parts.push(['Recommendation', `For the ${R.abi.n} people with a brain injury and neuropsychiatric needs now waiting in acute care, create ${m.totalBeds} places: ${mix.join(', ')}. This places ${m.placed} of ${R.abi.n} people.`]);
  parts.push(['Effect on acute care', `About ${n0(m.bedDays)} acute bed-days released a year (80% range ${n0(m.bd10)} to ${n0(m.bd90)}), room for about ${n0(m.admissions)} more admissions, worth ${moneyM(m.value)} a year at a conservative $1,090 per ALC day.¹`]);
  parts.push(['Cost', `${moneyM(m.opexYr)} a year to operate, a blended ${money(m.costPerNight)} per bed-night against $1,090 in acute care.²${m.capex ? ` One-time capital of ${moneyM(m.capex)} for the home.³` : ''} Net capacity value ${moneyM(m.net)} a year (80% range ${moneyM(m.net10)} to ${moneyM(m.net90)}).`]);
  parts.push(['Caveats', 'Unit costs are illustrative until CHORDS completes VCH’s cost-per-bed work. Ranges reflect occupancy, placement breakdown and operating cost. Draft for discussion; requires sign-off.']);
  return parts;
}
function memoHTML(m) {
  const parts = memoParts(m);
  if (!parts) return '<p>Set at least one option above zero to see its effect.</p>';
  const sup = { '¹': tip('Sutherland et al. 2019 estimate, 2016 dollars. Conservative.', 'costs.alc_day'), '²': tip('Illustrative unit costs by bed type.', 'finance.unit_costs'), '³': tip('Purchase and retrofit of a residential property. Illustrative.', 'capital.estimate') };
  return parts.map(([h, t]) => `<p><b>${h}.</b> ${esc(t).replace(/[¹²³]/g, (c) => `<sup ${sup[c]}>${c === '¹' ? 1 : c === '²' ? 2 : 3}</sup>`)}</p>`).join('');
}
function setSl(k, v) {
  S.sl[k] = k === 'occ' ? +v : Math.round(+v);
  const m = Engine.abiModel({ A: S.sl.A, B: S.sl.B, C: S.sl.C }, S.sl.occ);

  const rc = $('resCard'), memo = $('memo');
  if (rc) rc.innerHTML = S.mode === 'ops' ? opsResultsHTML(m) : resultsHTML(m);
  if (memo) memo.innerHTML = memoHTML(m);
}
function copyMemo() {
  const parts = memoParts(Engine.abiModel({ A: S.sl.A, B: S.sl.B, C: S.sl.C }, S.sl.occ));
  const text = parts ? parts.map(([h, t]) => `${h}. ${t.replace(/[¹²³]/g, '')}`).join('\n\n') : '';
  try { navigator.clipboard.writeText(text).then(() => toast('Memo text copied'), () => toast('Copy was blocked by the browser')); } catch (e) { toast('Copy was blocked by the browser'); }
}

/* ============================================================
   Live layer. The boards show a system in motion: a real clock,
   a seeded stream of synthetic events (bed requests, discharges,
   ALC designations, home-monitoring and Medly alerts), sign-offs
   that move through owner → operator → bed released, and alerts
   raised when a wait or a site crosses a threshold. Every event
   changes this state, and every figure on the boards is computed
   from it. Nothing here touches the guided tour's numbers.
   ============================================================ */
const MIN = 60000, HOUR = 3600000, DAY = 86400000;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const pad2 = (n) => String(Math.floor(n)).padStart(2, '0');
const fmtHM = (ms) => { const m = Math.max(0, Math.round(ms / MIN)); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${pad2(m % 60)} min`; };
const clock = (t, sec) => { const d = new Date(t); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}${sec ? ':' + pad2(d.getSeconds()) : ''}`; };

const Live = (() => {
  const D = DATA;
  let L = null, rnd = null;
  const ri = (lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1));
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const wpick = (items, w) => { let t = items.reduce((a, x) => a + w(x), 0) * rnd(); for (const x of items) { t -= w(x); if (t <= 0) return x; } return items[items.length - 1]; };
  const person = () => pick(D.nameParts.given) + ' ' + pick(D.nameParts.init);
  const unit = () => pick(D.units);
  const hash = (s) => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; };
  const siteOf = (id) => D.sites.find((s) => s.id === id);

  const dayStart = (now) => { const d = new Date(now); d.setHours(0, 0, 0, 0); return d.getTime(); };
  // "today" on the boards: since midnight, capped at 12 hours so an early-morning demo is not empty
  const todayStart = (now) => { const ds = dayStart(now); return now - ds < 3 * HOUR ? now - 3 * HOUR : Math.max(ds, now - 12 * HOUR); };
  const edLevel = (ms) => { const m = ms / MIN, T = D.thresholds.edWait; return m >= T.red ? 2 : m >= T.amber ? 1 : 0; };

  function push(e) { e.id = ++L.seq; L.events.push(e); return e; }

  // ---------- alerts from the home-monitoring and chronic-disease apps ----------
  function newAlert(app, t) {
    if (app === 'medly') {
      const r = pick(D.cdm.rules), pt = pick(D.medlyPanel);
      return { id: 'MA-' + (++L.alertSeq), app, pt, rule: r.t, sev: r.sev, reading: r.reading(ri), t, status: 'new' };
    }
    const r = pick(D.srm.rules);
    return { id: 'SA-' + (++L.alertSeq), app, pt: { id: 'S-' + ri(1000, 1999), name: person(), age: ri(66, 97) }, rule: r.t, sev: r.sev, reading: '', t, status: 'new' };
  }
  function closeAlert(a, t) {
    const esc = a.app === 'medly' && rnd() < (a.sev === 'red' ? 0.45 : 0.06);
    a.status = esc ? 'escalated' : 'resolved'; a.doneT = t;
    a.outcome = esc ? pick(D.cdm.escalations) : pick(a.app === 'medly' ? D.cdm.outcomes : D.srm.outcomes);
  }
  // the alerts already raised today when the board opens: older ones are closed, the newest are still in the queue
  function seedAlerts(app, panel, rate, now) {
    const from = todayStart(now), n = Math.max(5, Math.round(panel * rate * (now - from) / DAY));
    const out = [];
    for (let i = 0; i < n; i++) {
      const recent = i >= n - 4;
      const a = newAlert(app, recent ? now - ri(1, 26) * MIN - ri(0, 59) * 1000 : from + Math.floor(rnd() * (now - from - 30 * MIN)));
      const age = now - a.t;
      if (age > 28 * MIN) { a.ackT = a.t + ri(2, 14) * MIN; closeAlert(a, Math.min(now - MIN, a.ackT + ri(4, 25) * MIN)); }
      else if (age > 9 * MIN && rnd() < 0.7) { a.status = 'review'; a.ackT = a.t + ri(2, 8) * MIN; }
      out.push(a);
    }
    return out.sort((x, y) => x.t - y.t);
  }

  // a 24-point hourly history that ends at the current value
  function series(cur, vol, lo, hi) {
    const a = [cur];
    for (let i = 0; i < 23; i++) a.unshift(Math.round(clamp(a[0] + (rnd() - 0.5) * 2 * vol + (cur - a[0]) * 0.1, lo, hi)));
    return a;
  }

  function init(now = Date.now()) {
    rnd = mulberry32(31415926);
    Ops.reset();
    L = { born: now, seq: 0, alertSeq: 0, events: [], acceptAt: {} };
    L.occ = Object.fromEntries(D.sites.map((s) => [s.id, s.occ]));
    L.ed = D.edQueue.map((q) => { const t0 = now - q.waitMin * MIN - ri(0, 59) * 1000; return { ...q, t0, flagged: edLevel(now - t0) }; });
    L.edSeq = 7200 + D.edQueue.length;
    L.alcGone = new Set(); L.alcNew = []; L.alcSeq = 3400;
    L.signed = {}; L.accepted = {};
    L.sources = Object.fromEntries(D.sources.filter((s) => s.every).map((s) => [s.id, now - Math.floor(rnd() * s.every * 0.85) * 1000]));
    L.returns = Object.fromEntries(D.nodes.map((n) => [n.id, now - n.returnMinAgo * MIN]));
    L.hah = D.hahPatients.map((p) => ({ ...p, vitalsT: now - p.vitalsMinAgo * MIN }));
    L.srmExtra = 0; L.medlyExtra = 0;
    const srm = D.portfolio.find((p) => p.id === 'srm'), medly = D.cdm.apps[0];
    L.srmAlerts = seedAlerts('srm', srm.places - srm.open, D.srm.alertsPerPatientDay, now);
    L.medlyAlerts = seedAlerts('medly', D.medlyPanel.length, medly.alertsPerPatientDay, now);
    const hah = D.portfolio.find((p) => p.id === 'hah');
    L.series = {
      occ: series(D.occupiedAcute, 9, D.occupiedAcute - 40, D.occupiedAcute + 30),
      alc: series(D.patients.length, 3, D.patients.length - 14, D.patients.length + 12),
      ed: series(D.edQueue.length, 6, 22, 78),
      open: series(D.nodes.reduce((a, n) => a + n.open, 0), 1.6, 4, 19),
      hah: series(hah.places - hah.open, 1.4, 14, hah.places),
      srm: series(srm.places - srm.open, 3, srm.places - srm.open - 30, srm.places - srm.open + 6),
    };
    L.engineSlot = Math.floor(now / (D.schedule.engineEveryMin * MIN));
    L.siteState = null;
    L.nextEventT = now + 2600; L.nextAutoT = now + 24000;
    backfill(now);
    return L;
  }

  // the feed opens with the last 40 minutes: real entries from the seeded state, plus routine flow
  function backfill(now) {
    const since = now - 40 * MIN;
    L.ed.filter((q) => q.t0 > since).forEach((q) => push({ t: q.t0, cat: 'ED', sev: 'info', tab: 'flow', text: `Admit decision in emergency at ${siteOf(q.site).short}: ${q.svc.toLowerCase()} bed requested (${q.id})` }));
    L.ed.forEach((q) => { const T = D.thresholds.edWait; [[T.red, 'red', 'has now waited 10 hours for a bed, over target'], [T.amber, 'amber', 'has waited 6 hours for a bed']].forEach(([m, sev, txt]) => {
      const at = q.t0 + m * MIN; if (at > since && at <= now) push({ t: at, cat: 'ED', sev, tab: 'flow', text: `${q.id} at ${siteOf(q.site).short} ${txt}` }); }); });
    [['srm', L.srmAlerts, 'Remote monitoring', 'home', 'SRM'], ['medly', L.medlyAlerts, 'Medly', 'cdm', 'CDM']].forEach(([, list, label, tab, cat]) => list.forEach((a) => {
      if (a.t > since) push({ t: a.t, cat, sev: a.sev, tab, text: `${label} alert: ${a.pt.name}, ${a.rule.toLowerCase()}` });
      if (a.doneT && a.doneT > since) push({ t: a.doneT, cat, sev: a.status === 'escalated' ? 'amber' : 'good', tab, text: `${label}: ${a.pt.name}. ${a.outcome}` });
    }));
    for (let i = 0; i < 16; i++) { const t = since + Math.floor(rnd() * 38 * MIN); (rnd() < 0.5 ? flowEvent : bedAssigned)(t, false); }
    push({ t: L.engineSlot * D.schedule.engineEveryMin * MIN, cat: 'ENGINE', sev: 'info', tab: 'engine', text: `Decision engine: scheduled run complete, ${Ops.actions().length} drafted actions current` });
    L.events.sort((a, b) => a.t - b.t).forEach((e, i) => { e.id = i + 1; });
    L.seq = L.events.length;
  }

  // ---------- the stream ----------
  function bedAssigned(t, apply) {
    const sites = D.sites.filter((x) => L.ed.some((q) => q.site === x.id));
    const s = wpick(sites, (x) => x.edWaiting + 0.5);
    const qs = L.ed.filter((q) => q.site === s.id).sort((a, b) => a.t0 - b.t0);
    const q = qs[Math.min(qs.length - 1, Math.floor(Math.pow(rnd(), 2) * qs.length))];
    const waited = apply ? t - q.t0 : ri(3, 19) * HOUR + ri(0, 59) * MIN;
    if (apply) { L.ed.splice(L.ed.indexOf(q), 1); L.occ[s.id] += 1; }
    return push({ t, cat: 'ED', sev: 'good', tab: 'flow', text: `Bed assigned at ${s.short} ${unit()} after ${fmtHM(waited)} (${apply ? q.id : 'E-' + ri(7000, 7199)})` });
  }
  function edEvent(t) {
    const arrive = rnd() < clamp(0.5 + (D.edQueue.length - L.ed.length) * 0.05, 0.15, 0.85);
    if (!arrive && L.ed.length) return bedAssigned(t, true);
    const s = wpick(D.sites, (x) => x.edWaiting + 0.5);
    const q = { id: 'E-' + (L.edSeq++), site: s.id, age: ri(19, 94), svc: pick(D.services), t0: t, flagged: 0 };
    L.ed.push(q);
    return push({ t, cat: 'ED', sev: 'info', tab: 'flow', text: `Admit decision in emergency at ${s.short}: ${q.svc.toLowerCase()} bed requested (${q.id})` });
  }
  function flowEvent(t, apply) {
    const s = wpick(D.sites, (x) => x.beds);
    const out = rnd() < clamp(0.5 + (L.occ[s.id] - s.occ) * 0.12, 0.15, 0.85);
    if (apply) L.occ[s.id] += out ? -1 : 1;
    return push({ t, cat: 'FLOW', sev: out ? 'good' : 'info', tab: 'flow', text: out ? `Discharge confirmed at ${s.short} ${unit()}, bed being cleaned` : `Direct admission to ${s.short} ${unit()}` });
  }
  function alcEvent(t) {
    const cur = alc();
    const add = rnd() < clamp(0.5 + (D.patients.length - cur.length) * 0.1, 0.15, 0.85);
    const s = wpick(D.sites, (x) => x.alc);
    if (add) {
      const mix = { ltc: 10, ltcs: 3, al: 1, sh: 1.5, home: 1.5, complex: 1 };
      const need = wpick(Object.keys(mix), (n) => mix[n]);
      const young = need === 'complex' || need === 'sh';
      const p = { id: 'A-' + (L.alcSeq++), name: person(), age: young ? ri(34, 63) : ri(68, 93), site: s.id, need, dx: pick(D.needMeta[need].dx), days: 0, t0: t, fresh: true, conds: [] };
      L.alcNew.push(p);
      return push({ t, cat: 'ALC', sev: 'amber', tab: 'flow', text: `New ALC designation at ${s.short}: needs ${D.needMeta[need].label.toLowerCase()} (${p.id})` });
    }
    const held = Ops.protectedIds();
    const c = cur.filter((p) => p.site === s.id && !held.has(p.id) && !p.persona && (p.need === 'home' || p.need === 'ltc' || p.need === 'al'));
    if (!c.length) return flowEvent(t, true);
    const p = pick(c), dest = { home: 'home with supports', ltc: 'long-term care', al: 'assisted living' };
    if (p.fresh) L.alcNew.splice(L.alcNew.indexOf(p), 1); else L.alcGone.add(p.id);
    L.occ[s.id] -= 1;
    return push({ t, cat: 'ALC', sev: 'good', tab: 'flow', text: `ALC discharge from ${s.short} to ${dest[p.need]} after ${Math.round((t - alcT0(p)) / DAY)} days (${p.id})` });
  }
  function hahEvent(t) {
    const p = pick(L.hah);
    if (rnd() < 0.7) {
      p.vitalsT = t;
      if (rnd() < 0.3) p.news = clamp(p.news + (rnd() < 0.58 ? -1 : 1), 0, 7);
      const T = D.thresholds.news, sev = p.news >= T.red ? 'red' : p.news >= T.amber ? 'amber' : 'info';
      return push({ t, cat: 'HAH', sev, tab: 'home', text: `Hospital at Home: vitals in for ${p.name}, early-warning score ${p.news}${sev === 'red' ? ', review now' : sev === 'amber' ? ', watch' : ''}` });
    }
    return push({ t, cat: 'HAH', sev: 'good', tab: 'home', text: `Hospital at Home: video check-in done for ${p.name}, day ${p.day} of ${p.los}` });
  }
  function alertEvent(t, app) {
    const list = app === 'medly' ? L.medlyAlerts : L.srmAlerts;
    const label = app === 'medly' ? 'Medly' : 'Remote monitoring', tab = app === 'medly' ? 'cdm' : 'home', cat = app === 'medly' ? 'CDM' : 'SRM';
    const open = list.filter((a) => a.status === 'new' || a.status === 'review').sort((x, y) => x.t - y.t);
    if (open.length && rnd() < clamp(open.length * 0.13 - 0.05, 0, 0.85)) {
      const a = open[0];
      if (a.status === 'new') { a.status = 'review'; a.ackT = t; return push({ t, cat, sev: 'info', tab, text: `${label}: nurse reviewing ${a.pt.name} (${a.rule.toLowerCase()})` }); }
      closeAlert(a, t);
      return push({ t, cat, sev: a.status === 'escalated' ? 'amber' : 'good', tab, text: `${label}: ${a.pt.name}. ${a.outcome}` });
    }
    const a = newAlert(app, t); list.push(a);
    return push({ t, cat, sev: a.sev, tab, text: `${label} alert: ${a.pt.name}, ${a.rule.toLowerCase()}${a.reading && !/report|adherence/.test(a.reading) ? ' (' + a.reading + ')' : ''}` });
  }
  function communityEvent(t) {
    const late = D.nodes.filter((n) => t - L.returns[n.id] > DAY);
    const n = late.length && rnd() < 0.5 ? pick(late) : pick(D.nodes);
    L.returns[n.id] = t;
    return push({ t, cat: 'BEDS', sev: 'info', tab: 'beds', text: `Operator return received: ${n.name}, ${Ops.nodeOpen(n)} open` });
  }
  function nextEvent(t) {
    const k = rnd();
    if (k < 0.30) return edEvent(t);
    if (k < 0.43) return flowEvent(t, true);
    if (k < 0.51) return alcEvent(t);
    if (k < 0.63) return hahEvent(t);
    if (k < 0.75) return alertEvent(t, 'srm');
    if (k < 0.93) return alertEvent(t, 'medly');
    return communityEvent(t);
  }

  // ---------- sign-off flow: owner signs → operator accepts → bed released ----------
  function sign(key, t, by) {
    if (L.signed[key]) return;
    const a = Ops.actions().find((x) => x.key === key); if (!a) return;
    S.sent[key] = true; L.signed[key] = t;

  const when = st === 'awaiting' && a.dueT ? ` · held ${tmr(a.dueT, 'down')}` : L.signed[a.key] ? ` · signed ${clock(L.signed[a.key])}` : '';
  return `<div class="arow k-${a.kind} a-${st}"><i></i><div class="am"><div class="at">${esc(a.title)}</div><div class="a2"><div class="as">${esc(a.owner)}${when}</div><div class="ar">${statusPill(a)}${actButtons(a)}</div></div></div></div>`;
}
// the wall shows what needs a signature first, and keeps the latest signed moves in view
function wallActions(all) {
  const L = Live.L, open = all.filter((a) => ['awaiting', 'ready'].includes(Ops.status(a)));
  const recent = all.filter((a) => !open.includes(a)).sort((a, b) => (L.accepted[b.key] || L.signed[b.key] || 0) - (L.accepted[a.key] || L.signed[a.key] || 0)).slice(0, 2);
  return [...open.slice(0, 5 - recent.length), ...recent];
}
function flowHTML() {
  const now = Date.now(), X = Ops.sys(now), all = Ops.sorted();
  const alerts = Live.L.events.filter((e) => now - e.t < 30 * MIN && (e.sev === 'red' || e.sev === 'amber')).length;
  return `<div class="b-flow">
    <section class="sites" data-p="sites">${D.sites.map((s) => siteTile(Ops.siteStat(s, now))).join('')}</section>
    <div class="ocol">${queueHTML(now, X)}</div>
    <div class="ocol">
      <section class="opanel mapp" data-p="map">${panelH('Acute sites and community places', 'now', `<span class="mut">${X.drafted} moves drafted · <b class="num" data-k="m-signed">${X.signed}</b> signed</span>`)}${opsMapHTML(now)}</section>
      <section class="gauges" data-p="gauges">${gaugesHTML(now, X)}</section>
    </div>
    <div class="ocol">
      <section class="opanel feedp" data-p="feed">${panelH('Events and alerts', 'live', `<span class="mut"><b class="num" data-k="f-al">${alerts}</b> ${alerts === 1 ? 'alert' : 'alerts'} in 30 min</span>`)}<div class="ofeed">${feedRows(12)}</div></section>
      <section class="opanel actp" data-p="acts">${panelH('Action queue', 'drafted by the engine', `<span class="rel"><b class="num" data-k="a-rel">${X.released}</b> of ${X.drafted} beds released</span>`)}
        <div class="osub"><span><b class="num" data-k="a-wait">${X.awaiting}</b> awaiting sign-off</span><span><b class="num">${all.length - X.awaiting}</b> signed</span><button class="olink" onclick="setTab('engine')">All ${all.length} in Decision engine</button></div>
        <div class="alist">${wallActions(all).map(actRow).join('')}</div></section>
    </div>
  </div>`;
}
/* ============================================================
   The other four boards (Community beds, Home, CDM apps,
   Decision engine), the person drawer and huddle mode.
   ============================================================ */
const kpi = (label, value, sub, state = '', key = '') => `<div class="kpi"><div class="k-l">${label}</div><div class="k-v ${state ? 'c-' + state : ''} num"${key ? ` data-k="${key}"` : ''}>${value}</div><div class="k-s">${sub}</div></div>`;
const sevDot = (sev) => `<i class="sev s-${sev}"></i>`;
const ACK = () => ({ a: D.thresholds.ack.amber * MIN, r: D.thresholds.ack.red * MIN });

// ---------- Community beds ----------
function bedsHTML() {
  const now = Date.now(), X = Ops.sys(now), Dm = Ops.demand(), ret = Ops.returns(now);
  const offers = Ops.sorted().filter((a) => a.kind === 'place');
  const maxWait = Math.max(...Dm.rows.map((r) => r.waiting), ...Dm.none.map((r) => r[1]));
  const portfolio = Dm.rows.map((r) => {
    const st = r.openNow === 0 && r.waiting > 0 ? 'r' : r.waiting > r.openNow ? 'a' : 'g';
    return `<div class="prt" ${tip(`${r.label}: ${n0(r.occupied)} of ${n0(r.places)} places occupied. ${r.waiting} people in acute care are waiting for this setting. Illustrative cost per night.`, r.src)}>
      <div class="prt-h"><b>${esc(r.label)}</b><span class="pill ${r.openNow > 0 ? 'open' : 'zero'}"><b class="num" data-k="po-${r.id}">${r.openNow}</b> open</span></div>
      ${tbar(r.occupied / r.places, 0.9, 1, [], st)}
      <div class="prt-s"><span class="num">${n0(r.occupied)} of ${n0(r.places)} occupied</span><span class="c-${st === 'g' ? '' : st}"><b class="num">${r.waiting}</b> waiting in acute</span><span class="num">${money(r.costNight)} a night</span></div></div>`;
  }).join('');
  const vrow = (key, title, sub) => { const a = Ops.byKey(key); return row2('a-' + Ops.status(a), title, statusPill(a), sub, actButtons(a)); };
  const vfm = R.contracts.rows.map((c, i) => vrow('contract:' + i, esc(c.name.replace(/ \(.*/, '')), `<b class="c-a num">${pc(c.occ90)}</b> occupied over 90 days · ${c.empty} of ${c.units} empty · ${moneyK(c.empty * c.costNight * 365)} a year`)).join('')
    + vrow('mismatch', `${R.mismatches.stepUp + R.mismatches.stepDown} residents in the wrong level of support`, `${R.mismatches.stepUp} need more care · ${R.mismatches.stepDown} could step down from long-term care`);
  const tiles = D.nodes.map((n) => {
    const open = Ops.nodeOpen(n), acts = Ops.actions().filter((a) => a.node === n), late = now - Live.L.returns[n.id] > DAY;
    const a = acts[0], st = a ? Ops.status(a) : null;
    const line = !a ? (late ? `<span class="c-a">Full · return overdue</span>` : '<span class="mut">Full</span>')
      : st === 'awaiting' ? `<span class="c-o">Offer drafted: ${esc(a.p.name)}</span>`
      : st === 'signed' ? `<span class="c-b">Held for ${esc(a.p.name)}, signed</span>` : `<span class="c-g">Accepted ${esc(a.p.name)} today</span>`;
    return `<div class="ptile${open > 0 ? ' open' : ''}${st && st !== 'awaiting' ? ' held' : ''}" style="--tc:${TYPE_COL[n.type]}" ${tip(`${n.name}${n.program ? '' : ' · ' + n.beds + ' places'} · last operator return ${fmtHM(now - Live.L.returns[n.id])} ago${n.open ? ' · place open for ' + n.openHours + ' h' : ''}`, 'operator returns · paris.community_capacity')}>
      <div class="pt-t">${{ ltcs: 'Secured LTC', cch: 'Complex care' }[n.type] || TYPE_LAB[n.type]}</div><div class="pt-n">${esc(n.name.split(' · ')[1])}</div>
      <div class="pt-m"><span>${n.program ? 'Program' : `<b class="num">${n.beds}</b> places`}</span>${open > 0 ? `<span class="pill open num">${open} open</span>` : ''}</div>
      <div class="pt-s">${line}</div></div>`;
  }).join('');
  const bar = (label, n, open, cls, right) => `<div class="drow"><span class="d-l">${label}</span><div class="d-b"><span class="${cls}" style="width:${(n / maxWait * 100).toFixed(1)}%"></span></div><b class="num">${n}</b><span class="d-o">${right}</span></div>`;
  const demand = Dm.rows.map((r) => bar(esc(r.label), r.waiting, r.openNow, 'f-b', r.openNow > 0 ? `<span class="pill open num">${r.openNow} open</span>` : '<span class="pill zero">0 open</span>')).join('')
    + Dm.none.map(([k, n]) => bar(D.needMeta[k].label, n, 0, 'f-r', '<span class="pill zero">no setting exists</span>')).join('');
  const offerRow = (a) => { const st = Ops.status(a), t = D.portfolio.find((q) => q.id === a.node.type);
    return `<div class="orow click a-${st}" onclick="peek('${a.key}')"><div class="am"><div class="at">${esc(a.p.name)}, ${a.p.age} <span class="mut">· ${site(a.p.site).code} · ${a.p.days} d ALC${st === 'awaiting' ? ` · held ${tmr(a.dueT, 'down')}` : ''}</span></div>
      <div class="as">${esc(a.node.name)} · ${a.km.toFixed(1)} km · ${money(t.costNight)} a night</div></div><div class="ar">${statusPill(a)}${actButtons(a, true)}</div></div>`; };
  return `<div class="b-beds">
    <div class="ocol">
      <section class="opanel grow" data-p="portfolio">${panelH('Community portfolio', 'occupancy · open now · waiting in acute care', `<b class="num big c-o" data-k="b-open">${X.open}</b>`)}${portfolio}
        <div class="prt none"><div class="prt-h"><b>No setting exists in the portfolio</b><button class="obtn" onclick="setTab('engine')">Options analysis</button></div>
          <div class="prt-s"><span>${Dm.none.map(([k, n]) => `<b class="num">${n}</b> ${D.needMeta[k].label.toLowerCase()}`).join(' · ')}</span></div></div></section>
      <section class="opanel" data-p="vfm">${panelH('Value for money', '', `<span class="mut num">${R.contracts.empty} empty units · ${moneyK(R.contracts.costYr)} a year</span>`)}${vfm}</section>
    </div>
    <div class="ocol">
      <section class="opanel" data-p="places">${panelH('Place board', `${D.nodes.length} operators and programs on the map`, `<span class="mut"><b class="num">${X.open}</b> open · <b class="num">${offers.filter((a) => Ops.status(a) !== 'awaiting').length}</b> of ${offers.length} offers signed</span>`)}<div class="ptiles">${tiles}</div></section>
      <section class="opanel grow" data-p="demand">${panelH('Waiting in acute care, by where each person needs to go', 'against places open now')}${demand}</section>
    </div>
    <div class="ocol">
      <section class="opanel grow" data-p="offers">${panelH('Offers in progress', 'select a row to review the match', `<b class="num big" data-k="b-off">${offers.filter((a) => Ops.status(a) === 'awaiting').length}</b>`)}<div class="olist">${offers.map(offerRow).join('')}</div></section>
      <section class="opanel" data-p="returns">${panelH('Operator returns', 'last 24 hours', `<span class="${ret.n < ret.of ? 'c-a' : 'c-g'}"><b class="num" data-k="b-ret">${ret.n}</b> of ${ret.of} in</span>`)}
        ${ret.late.length ? ret.late.slice(0, 3).map((n) => `<div class="vrow slim"><span>${esc(n.name)}</span><span class="c-a">last return ${tmr(Live.L.returns[n.id], 'ago')} ago</span></div>`).join('') + (ret.late.length > 3 ? `<div class="vrow slim mut"><span>and ${ret.late.length - 3} more</span></div>` : '') : '<div class="vrow slim"><span class="c-g">Every operator has reported in the last 24 hours.</span></div>'}
        <div class="srcnote">Occupancy is only as current as the last return. Late returns are chased before the morning huddle.</div></section>
    </div>
  </div>`;
}

// ---------- Home: Hospital at Home and Seniors Remote Monitoring ----------
function alertRow(a) {
  const waiting = a.status === 'new';
  return `<div class="alrow ${waiting ? 'new' : ''}">${sevDot(a.sev)}<div class="am"><div class="at">${esc(a.pt.name)}, ${a.pt.age}${a.pt.nyha ? ` <span class="mut">· NYHA ${a.pt.nyha}</span>` : ''}</div><div class="as">${esc(a.rule)}${a.reading && !/report|adherence/.test(a.reading) ? ` · <b class="num">${a.reading}</b>` : ''} · raised ${clock(a.t)}</div></div>
    <div class="ar">${waiting ? `<span class="wt">waiting ${tmr(a.t, 'ms', ACK())}</span><button class="obtn pri" onclick="ackAlert('${a.id}')">Acknowledge</button>` : `<span class="pill ocean">Nurse reviewing · ${tmr(a.ackT, 'ms')}</span>`}</div></div>`;
}
const closedRow = (a) => `<div class="alrow closed"><span class="ft mono">${clock(a.doneT)}</span><div class="am"><div class="as"><b>${esc(a.pt.name)}</b> · ${esc(a.rule)}</div></div><span class="pill ${a.status === 'escalated' ? 'warn' : 'good'}">${esc(a.outcome)}</span></div>`;
function homeHTML() {
  const now = Date.now(), H = Ops.hah(now), SR = Ops.srm(now), X = Ops.sys(now), T = D.thresholds.news;
  const hahCost = D.portfolio.find((p) => p.id === 'hah').costNight, srmCost = D.portfolio.find((p) => p.id === 'srm').costNight;
  const rows = H.rows.slice(0, 24).map((p) => `<tr class="h-${p.state}"><td><b>${esc(p.name)}</b>, ${p.age}</td><td class="tr">${esc(p.dx)}</td><td class="num">${p.day} of ${p.los}</td>
    <td><span class="news n-${p.state} num" data-k="nw-${p.id}">${p.news}</span> <span class="c-${p.state === 'g' ? '' : p.state}">${{ g: 'Stable', a: 'Watch', r: 'Review now' }[p.state]}</span></td>
    <td class="r">${tmr(p.vitalsT, 'ms', { a: 60 * MIN })}</td><td class="r num">${p.tomorrow ? 'tomorrow ' : ''}${clock(p.nextT)}</td></tr>`).join('');
  const cand = (a) => `<div class="orow click a-${Ops.status(a)}" onclick="peek('${a.key}')"><div class="am"><div class="at">${esc(a.p.name)}, ${a.p.age} <span class="mut">· ${site(a.p.site).code}${a.p.unit ? ' ' + esc(a.p.unit) : ''}</span></div><div class="as">${esc(a.p.dx)}</div></div><div class="ar">${statusPill(a)}${actButtons(a, true)}</div></div>`;
  const not = R.hah.ineligible.map((p) => `<div class="orow"><div class="am"><div class="at mut">${esc(p.name)}, ${p.age} <span class="mut">· ${site(p.site).code}</span></div><div class="as">${esc(p.dx)}</div></div><div class="ar"><span class="pill zero">${esc(p.reason)}</span></div></div>`).join('');
  const hahActs = Ops.actions().filter((a) => a.kind === 'hah'), srmActs = Ops.actions().filter((a) => a.kind === 'srm');
  const room = Math.max(0, Math.floor((560 - SR.open.length * 46) / 27)); // closed rows that fit under the open queue
  return `<div class="b-home">
    <section class="opanel" data-p="hah">${panelH('Hospital at Home', 'acute care, delivered at home', `<span class="mut">sorted by early-warning score</span>`)}
      <div class="kpis">${kpi('At home now', `${H.rows.length}<small>/${H.cap}</small>`, 'people in the program', '', 'h-n')}${kpi('Slots free', H.cap - H.rows.length, 'ready for a transfer today', 'o', 'h-free')}${kpi('Visits today', `${H.visitsDone}<small>/${H.visitsPlanned}</small>`, 'nurse visits done', '', 'h-vis')}${kpi('Review now', H.review, `${H.watch} more on watch`, H.review ? 'r' : 'g', 'h-rev')}</div>
      <table class="otable"><thead><tr><th>Person</th><th>Condition</th><th>Day</th><th ${tip(`Early-warning score from the latest vitals. Watch at ${T.amber}, review now at ${T.red}.`, 'thresholds.news')}>Score</th><th class="r">Last vitals</th><th class="r">Next visit</th></tr></thead><tbody>${rows}</tbody></table></section>
    <div class="ocol">
      <section class="opanel" data-p="cands">${panelH('Could be treated at home today', 'inpatients in acute beds · select a row to review')}
        <div class="funnel"><span><b class="num">${n0(R.hah.screened)}</b> inpatients screened</span><i>›</i><span><b class="num">${R.hah.eligible.length + R.hah.ineligible.length}</b> low risk on Signal 1</span><i>›</i><span class="c-o"><b class="num">${R.hah.eligible.length}</b> meet every program criterion</span></div>
        <div class="olist">${hahActs.map(cand).join('')}${not}</div></section>
      <section class="opanel" data-p="srmc">${panelH('Can go home today with a monitoring kit', 'ALC patients waiting for home support', `<span class="mut"><b class="num">${SR.free}</b> kits free</span>`)}<div class="olist">${srmActs.map(cand).join('')}</div></section>
      <section class="opanel grow worth" data-p="worth">${panelH('Care at home, in acute beds')}
        <p><b class="num">${X.hah}</b> people are receiving acute-level care at home right now. That is <b class="num">${X.hah}</b> acute beds open for emergency and surgical patients.</p>
        <div class="kv"><span>Hospital at Home, a night</span><b>${money(hahCost)}</b></div><div class="kv"><span>Remote monitoring, a night</span><b>${money(srmCost)}</b></div><div class="kv"><span>Acute bed, patient ready to leave</span><b>${money(D.costs.alcDay)}</b></div>
        <div class="srcnote">Illustrative unit costs. Released beds refill with other patients; this is capacity, not cash.</div></section>
    </div>
    <section class="opanel" data-p="srm">${panelH('Seniors Remote Monitoring', 'a kit at home, a nurse on the alerts')}
      <div class="kpis">${kpi('Monitored now', `${n0(SR.enrolled)}<small>/${SR.cap}</small>`, 'kits in use', '', 's-n')}${kpi('Kits free', SR.free, 'ready to go out', 'o', 's-free')}${kpi('Alerts today', SR.today.length, `${SR.closed.length} closed`, '', 's-al')}${kpi('Waiting for a nurse', SR.fresh, `${SR.open.length - SR.fresh} being reviewed`, SR.fresh ? 'a' : 'g', 's-wait')}</div>
      <div class="rdg" ${tip(`Each kit should send ${D.srm.readingsPerDay} readings a day. Expected so far today against received.`, 'srm.readings')}><span>Readings in today</span>${tbar(SR.received / Math.max(1, SR.expected), 0, 1, [0.9], SR.received / Math.max(1, SR.expected) >= 0.9 ? 'g' : 'a')}<b class="num">${n0(SR.received)} of ${n0(SR.expected)}</b></div>
      <div class="osec">Triage queue</div><div class="olist">${SR.open.map(alertRow).join('') || '<div class="alrow"><span class="c-g">No alerts waiting.</span></div>'}</div>
      <div class="osec">Closed today</div><div class="olist">${SR.closed.slice(0, room).map(closedRow).join('')}</div></section>
  </div>`;
}

// ---------- CDM apps ----------

  const live = `<section class="opanel app live" data-p="medly">
      <div class="app-h"><span class="slot">${app.slot}</span><div><div class="app-n">${app.name} <span class="mut">· ${app.condition.toLowerCase()}</span></div><div class="app-c">With ${esc(app.partner.replace('UHN', 'UHN’s'))}</div></div><span class="pill good">● Live</span></div>
      ${metrics([['Patients enrolled', M.enrolled, 'followed at home', '', 'm-n'], ['Alerts today', M.today.length, `${M.closed.length} closed`, '', 'm-al'], ['Waiting for a nurse', M.fresh, `${M.open.length - M.fresh} being reviewed`, M.fresh ? 'a' : 'g', 'm-wait'], ['Escalations', M.escalated, 'beyond the nurse', M.escalated ? 'a' : 'g', 'm-esc']])}

  const enrol = Ops.actions().filter((a) => a.kind === 'cdm').map((a) => `<div class="orow a-${Ops.status(a)}"><div class="am"><div class="at">${esc(a.p.name)}, ${a.p.age} <span class="mut">· ${site(a.p.site).code}</span></div><div class="as">${esc(a.p.dx)} · leaving hospital today</div></div><div class="ar">${statusPill(a)}${actButtons(a)}</div></div>`).join('');
  const box = (a) => `<div class="ly-app ${a.status}"><b>${a.name || 'App ' + a.slot}</b><small>${a.status === 'live' ? a.condition : a.milestone}</small></div>`;

    <div class="ocol">

        <div class="layer">
